<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DP ILED — Departamento Pessoal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0b0f;--bg2:#111319;--panel:#14161d;--panel2:#171922;--panelh:#1b1e28;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --txt:#eef0f5;--mut:#9aa0af;--mut2:#6b7180;
  --red:#e10600;--red2:#ff1f44;--grn:#3ddc84;--amber:#ffb020;--blue:#4f8cff;--violet:#a259ff;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --glass:rgba(24,26,34,.55);--glass-hi:rgba(255,255,255,.06);
  --glass-bd:rgba(255,255,255,.12);
  --glass-sh:0 10px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.10);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--txt);font-size:14px;
  background:
    radial-gradient(1200px 600px at 85% -10%,rgba(225,6,0,.16),transparent 60%),
    radial-gradient(900px 520px at 0% 0%,rgba(255,31,68,.10),transparent 55%),
    #0a0b0f;
  min-height:100vh;
}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.subbar{height:4px;width:100%;display:flex;position:sticky;top:0;z-index:50}
.subbar span{flex:1}
.subbar span:nth-child(1){background:var(--red)}
.subbar span:nth-child(2){background:var(--amber)}
.subbar span:nth-child(3){background:#e9ecf5}
.subbar span:nth-child(4){background:var(--blue)}
header,nav.tabs,main{position:relative;z-index:1}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;flex-wrap:wrap}
header img{height:56px;width:auto}
.logo-rgb{
  mix-blend-mode:screen;
  animation:rgbglow 6s linear infinite;
}
@keyframes rgbglow{
  0%   {filter:drop-shadow(0 0 5px rgba(255,0,64,.85)) drop-shadow(0 0 14px rgba(255,0,64,.4))}
  25%  {filter:drop-shadow(0 0 5px rgba(255,180,0,.85)) drop-shadow(0 0 14px rgba(255,180,0,.4))}
  50%  {filter:drop-shadow(0 0 5px rgba(0,220,120,.85)) drop-shadow(0 0 14px rgba(0,220,120,.4))}
  75%  {filter:drop-shadow(0 0 5px rgba(40,120,255,.85)) drop-shadow(0 0 14px rgba(40,120,255,.4))}
  100% {filter:drop-shadow(0 0 5px rgba(255,0,64,.85)) drop-shadow(0 0 14px rgba(255,0,64,.4))}
}
.htitle{font-weight:800;letter-spacing:-.4px;font-size:18px;line-height:1}
.hsub{color:var(--mut);font-size:12px;margin-top:3px}
.dbchip{margin-left:auto;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut2);display:inline-block}
.dot.on{background:var(--grn);box-shadow:0 0 10px rgba(61,220,132,.8)}
.dot.off{background:var(--amber)}
nav.tabs{display:flex;gap:4px;padding:0 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.tabs button{
  background:none;border:none;padding:11px 16px;cursor:pointer;color:var(--mut);
  font-weight:600;font-size:13px;border-bottom:2px solid transparent;font-family:inherit;
}
nav.tabs button.active{color:var(--txt);border-bottom-color:var(--red)}
main{padding:20px 26px 60px;max-width:none;width:100%}
.panel,.card{
  background:linear-gradient(180deg,var(--glass-hi) 0%,var(--glass) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--glass-bd);border-top:1px solid rgba(255,255,255,.18);
  border-radius:14px;box-shadow:var(--glass-sh);
}
.card{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi .eye{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.kpi .big{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:6px}
.kpi .desc{font-size:11.5px;color:var(--mut);margin-top:3px}
.kpi.hero{border-top:3px solid var(--red);background:linear-gradient(180deg,rgba(225,6,0,.14),var(--glass))}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select{
  font-family:inherit;font-size:13px;color:var(--txt);background:rgba(255,255,255,.04);
  border:1px solid var(--line2);border-radius:9px;padding:8px 10px;outline:none;
}
input::placeholder{color:var(--mut2)}
.datetrio{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:9px;padding:0 4px}
.datetrio:focus-within{border-color:var(--red);box-shadow:0 0 0 2px rgba(225,6,0,.25)}
.datetrio.err{border-color:var(--red2)!important;box-shadow:0 0 0 2px rgba(255,31,68,.28)!important;background:rgba(255,31,68,.08)!important}
label.fl.fl-err{color:var(--red2)}
label.fl.fl-err select,label.fl.fl-err input:not(.dtd):not(.dtm):not(.dta){border-color:var(--red2)!important;box-shadow:0 0 0 2px rgba(255,31,68,.28)!important;background:rgba(255,31,68,.08)!important}
.req-mark{color:var(--red2);font-weight:800;font-size:10.5px;margin-left:4px;letter-spacing:.3px}
.colab-missing-banner{border:1.5px solid var(--red2);background:rgba(225,6,0,.14);color:#ffb3ba;padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:12.5px;line-height:1.6}
.colab-missing-banner b{color:#fff}
.savebtn-err{background:var(--red2)!important}
.datetrio input{border:none!important;background:transparent!important;box-shadow:none!important;padding:8px 2px!important;text-align:center;min-width:0!important;letter-spacing:.5px}
.datetrio input.dtd,.datetrio input.dtm{width:26px!important}
.datetrio input.dta{width:46px!important}
.datetrio .dtsep{color:var(--mut2);font-size:11px}
td .datetrio{width:100%;padding:2px 4px}
label.fl .datetrio{margin-top:1px}
.money-wrap{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:9px;padding:0 8px;width:100%;box-sizing:border-box}
.money-wrap:focus-within{border-color:var(--red);box-shadow:0 0 0 2px rgba(225,6,0,.25)}
.money-wrap .money-prefix{color:var(--mut2);font-size:11.5px;font-weight:700;flex:none}
.money-wrap input.money-input{border:none!important;background:transparent!important;box-shadow:none!important;padding:8px 0!important;text-align:right;width:100%;min-width:0;font-variant-numeric:tabular-nums}
td .money-wrap{padding:2px 6px}
label.fl.fl-err .money-wrap{border-color:var(--red2)!important;box-shadow:0 0 0 2px rgba(255,31,68,.28)!important;background:rgba(255,31,68,.08)!important}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(225,6,0,.25)}
select option{background:#14161d;color:var(--txt)}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut);font-weight:600}
.btn{
  border:none;border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;
  cursor:pointer;font-family:inherit;background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(225,6,0,.4);
}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.ghost.active{background:rgba(79,140,255,.16);color:#7aa8ff;border-color:rgba(79,140,255,.4)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.save{background:var(--mut2)}
.btn.save.draft{background:var(--amber)}
.btn.save.saved{background:var(--grn)}
.tablewrap{overflow:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{
  background:var(--panelh);color:var(--mut);text-transform:uppercase;font-size:10px;
  letter-spacing:.8px;padding:9px 10px;text-align:left;position:sticky;top:0;white-space:nowrap;
  position:relative;overflow:hidden;text-overflow:ellipsis;
}
th.resizable-th{padding-right:16px}
.col-resizer{
  position:absolute;top:0;right:0;width:10px;height:100%;cursor:col-resize;
  touch-action:none;z-index:5;
}
.col-resizer::after{
  content:'';position:absolute;top:3px;bottom:3px;right:3px;width:2px;
  background:var(--line2);border-radius:2px;
}
.col-resizer:hover::after,.col-resizer.active::after{background:var(--red);width:3px}
table.tbl-resizable{table-layout:fixed}
td{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--txt)}
tr:nth-child(even) td{background:rgba(255,255,255,.025)}
tr:hover td{background:rgba(255,255,255,.05)}
td input,td select{border:1px solid transparent;background:transparent;padding:5px 6px;width:100%;min-width:70px;border-radius:6px;color:var(--txt)}
td input:hover,td select:hover{border-color:var(--line2)}
td input:focus,td select:focus{border-color:var(--red);background:rgba(255,255,255,.06)}

/* ===== Tabela de Rescisões: larguras fixas por coluna para não espremer nome/tipo ===== */
#tbl_rescisoes{table-layout:fixed}
#tbl_rescisoes col.c-empresa{width:7%}
#tbl_rescisoes col.c-colaborador{width:14%}
#tbl_rescisoes col.c-clt{width:5%}
#tbl_rescisoes col.c-deslig{width:8%}
#tbl_rescisoes col.c-tipo{width:12%}
#tbl_rescisoes col.c-detalhes{width:10%}
#tbl_rescisoes col.c-valor{width:7%}
#tbl_rescisoes col.c-total{width:8%}
#tbl_rescisoes col.c-venc{width:8%}
#tbl_rescisoes col.c-fin{width:6%}
#tbl_rescisoes col.c-pasta{width:11%}
#tbl_rescisoes col.c-concl{width:5%}
#tbl_rescisoes col.c-del{width:3%}
#tbl_rescisoes td,#tbl_rescisoes th{overflow:hidden}
#tbl_rescisoes td input,#tbl_rescisoes td select{min-width:0}
#tbl_rescisoes td[data-col="colaborador"] input{font-weight:600}
#tbl_rescisoes td[data-col="valor_total_calc"] span{font-size:12.5px;font-weight:700;white-space:nowrap}
#tbl_rescisoes td[data-col="valor"] input{width:100%}
#tbl_rescisoes td[data-col="pasta"] .flex{flex-wrap:wrap;gap:4px}
#tbl_rescisoes tr.subrow-pj td{background:rgba(79,140,255,.06);border-bottom:1px solid var(--line2);padding:7px 12px}
#tbl_rescisoes tr.subrow-pj .subrow-inner{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#tbl_rescisoes tr.subrow-pj .subrow-inner .chip{font-size:10.5px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#tbl_rescisoes tr.subrow-pj .subrow-inner input[type="checkbox"]{margin:0}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.c-ok{background:rgba(61,220,132,.16);color:#4fe89a}
.c-warn{background:rgba(255,176,32,.16);color:#ffc457}
.c-crit{background:rgba(255,31,68,.18);color:#ff6b82}
.c-info{background:rgba(79,140,255,.16);color:#7aa8ff}
.c-mut{background:rgba(255,255,255,.08);color:var(--mut)}
.section-title{font-weight:800;font-size:15px;margin:0 0 4px}
.section-sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px 18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-weight:700;font-size:11px;color:var(--mut);padding:4px 0;text-transform:uppercase}
.cal-cell{min-height:100px;border:1px solid var(--line);border-radius:10px;padding:6px;background:rgba(255,255,255,.02);overflow:auto}
.cal-cell.cal-empty{background:transparent;border-color:transparent}
.cal-daynum{font-weight:700;font-size:12.5px;margin-bottom:4px}
.cal-today{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.cal-q5{background:rgba(255,193,7,.16);border-color:var(--amber)}
.cal-event{font-size:10.5px;line-height:1.3;background:rgba(255,255,255,.06);border-radius:6px;padding:2px 5px;margin-bottom:3px;word-break:break-word}
.cal-event-paid{background:rgba(61,220,132,.22);color:var(--grn);font-weight:600}
.cal-event-late{background:rgba(225,6,0,.2);color:var(--red2)}
.cal-event-warn{background:rgba(255,176,32,.22);color:var(--amber)}
.cal-daytotal{font-size:10px;font-weight:800;color:var(--amber);margin-top:4px;padding-top:4px;border-top:1px dashed var(--line2);white-space:nowrap}
.cal-event-antecip{border-left:3px solid var(--violet);box-shadow:0 0 0 1px rgba(162,89,255,.35) inset;font-weight:700}
@media(max-width:760px){ .cal-cell{min-height:70px;font-size:11px} .cal-event{font-size:9.5px} .cal-daytotal{font-size:9px} }
.subtabs{display:flex;gap:6px;margin:6px 0 16px;flex-wrap:wrap}
.subtabs button{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--mut);font-family:inherit}
.subtabs button.active{background:rgba(225,6,0,.14);color:var(--txt);border-color:var(--red);box-shadow:var(--glass-sh)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:26px 14px;overflow:auto}
.overlay.show{display:flex}
.modal{width:96vw;max-width:1700px;padding:28px 32px;margin:auto 0}
.modal h2{margin:0 0 2px;font-size:18px}
.modal .flex{gap:18px}
.modal label.fl{flex:1 1 260px;min-width:240px;font-size:12.5px}
.modal label.fl input,.modal label.fl select{width:100%;padding:11px 12px;font-size:14.5px}
.modal .card{padding:20px}
.fotobox{position:relative;width:64px;height:64px;flex:none}
.fotobox .circ{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--panelh);
  border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--mut);font-size:24px}
.fotobox .circ img{width:100%;height:100%;object-fit:cover}
.fotobox input[type=file]{display:none}
.fotobox .rm{position:absolute;bottom:-4px;right:-4px;background:var(--red);color:#fff;border:2px solid var(--panel);
  border-radius:50%;width:20px;height:20px;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.savebtn-ok{background:var(--grn)!important;box-shadow:0 6px 18px rgba(61,220,132,.4)!important}
.xrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.close{cursor:pointer;font-size:22px;color:var(--mut);background:none;border:none}
.searchcard{cursor:pointer;transition:transform .1s}
.searchcard:hover{transform:translateY(-2px);border-color:rgba(225,6,0,.45)}
.emp-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--mut)}
.venc-line{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.muted{color:var(--mut)}
canvas{max-width:100%}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.empgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.empcard .nm{font-weight:700;font-size:13.5px;margin-bottom:2px}
.empcard .fn{color:var(--mut);font-size:11.5px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}

/* ===== FREELANCERS — banco de dados por estado ===== */
.uf-badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:linear-gradient(135deg,rgba(162,89,255,.28),rgba(79,140,255,.22));color:#d9c6ff;border:1px solid rgba(162,89,255,.35);letter-spacing:.4px}
.uf-group{margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.uf-group .uf-big{font-size:15px;font-weight:800;color:var(--txt)}
.uf-group .uf-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(162,89,255,.45),transparent)}
.uf-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.uf-chips button{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--mut);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.uf-chips button.active{background:rgba(162,89,255,.22);border-color:rgba(162,89,255,.6);color:#fff}
.freel-card .ev{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.5}
.freel-card .ev b{color:var(--txt);font-weight:700}
.freel-card .cache{margin-left:auto;font-weight:800;font-size:12.5px;color:var(--grn)}

/* ===== LOGIN / USUÁRIOS / PERMISSÕES ===== */
.lock{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(225,6,0,.18),rgba(10,11,15,.97) 60%);backdrop-filter:blur(8px)}
.lock.show{display:flex}
.lockbox{width:min(400px,92vw);background:var(--panel);border:1px solid var(--line2);border-top:3px solid var(--red);border-radius:18px;padding:26px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px}
.lock-logo{font-size:34px;text-align:center}
.lock-title{font-size:19px;font-weight:800;text-align:center;color:var(--txt)}
.lock-sub{font-size:12.5px;text-align:center;color:var(--mut);margin-top:-6px}
.lockbox label.fl input,.lockbox label.fl select{width:100%;padding:11px 12px;font-size:14.5px;box-sizing:border-box}
.pin-in{letter-spacing:8px;font-size:20px!important;text-align:center;font-weight:800}
.lock-msg{font-size:12.5px;line-height:1.5;border-radius:10px;padding:0}
.lock-msg.err{background:rgba(225,6,0,.14);border:1px solid rgba(255,31,68,.45);color:#ffb3ba;padding:9px 12px}
.lock-msg.info{background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.4);color:#b9d0ff;padding:9px 12px}
.lock-hint{font-size:11.5px;color:var(--mut);text-align:center;line-height:1.5}
.lock-spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--red);margin:10px auto;animation:lkspin .8s linear infinite}
@keyframes lkspin{to{transform:rotate(360deg)}}
.sens-box{padding:10px 12px;border-radius:9px;border:1px dashed rgba(255,176,32,.45);background:rgba(255,176,32,.07);color:#ffc457;font-size:12.5px;font-weight:700}
.sens-inline{color:#ffc457;font-weight:700;font-size:11.5px}
.ro-banner{margin-bottom:12px;padding:9px 14px;border-radius:10px;background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.4);color:#b9d0ff;font-size:12.5px;font-weight:600}
.user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--violet));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.user-card.user-bloq{border-color:rgba(255,31,68,.55)}
.perm-tbl td,.perm-tbl th{text-align:center}
.perm-tbl td:first-child,.perm-tbl th:first-child{text-align:left}
.perm-tbl input.pchk{width:18px;height:18px;accent-color:var(--grn);cursor:pointer}
label.tgl{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer}
label.tgl input{width:18px;height:18px;margin-top:2px;accent-color:var(--grn)}

.freel-filter{margin-bottom:12px;border-top:2px solid var(--violet)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--mut);padding:9px 14px;font-weight:700;font-size:12.5px;cursor:pointer}
.seg button.active{background:rgba(162,89,255,.25);color:#fff}
.freel-card .ev-line{padding:5px 0;border-bottom:1px dashed var(--line)}
.freel-card .ev-line:last-child{border-bottom:0}
.freel-card .ev-val{color:var(--grn);font-weight:800}
.ev-card{border-left:3px solid var(--violet)}

.qtd-chip{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:6px;background:rgba(61,220,132,.15);color:var(--grn);border:1px solid rgba(61,220,132,.35)}

.pix-card{border-top:2px solid var(--grn)}
.wa-btn{background:#1faa53!important;border-color:#1faa53!important;color:#fff!important}
.pix-prev{margin-top:10px;padding:12px 14px;border-radius:12px;background:#0b3d2a;border:1px solid rgba(61,220,132,.35);color:#e9fff2;font-size:13px;line-height:1.55;white-space:normal}

.pix-bell{background:rgba(255,176,32,.18)!important;border-color:rgba(255,176,32,.6)!important;color:#ffc457!important;animation:bellpulse 1.6s ease-in-out infinite}
@keyframes bellpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,176,32,.45)}50%{box-shadow:0 0 0 6px rgba(255,176,32,0)}}
.pix-avisos{margin-bottom:12px;border-top:2px solid #ffb020}
.pix-aviso-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line)}
.pix-aviso-line:last-child{border-bottom:0}
.pix-corr{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.45);font-size:12.5px}
.pix-key{font-weight:800;color:var(--txt);letter-spacing:.3px}

.section-title.col-title{cursor:pointer;user-select:none}
.section-title.col-title:hover{color:#fff}
.col-arrow{display:inline-block;width:16px;margin-right:4px;color:var(--mut);font-size:12px;transition:transform .15s}
.card.collapsed > :not(.col-head){display:none!important}
.card.collapsed{padding-bottom:12px}
.card.collapsed > .col-head{margin-bottom:0!important}
.card.collapsed .col-head .section-title{margin-bottom:0}
.col-bar{display:flex;gap:6px;justify-content:flex-end;margin:-4px 0 10px}
</style>

  keys.forEach(function(k){
    fetch(CFG.url+'/rest/v1/'+TBL[k]+'?select=*',{headers:sbHeaders()})
      .then(function(r){ return r.ok?r.json():[]; })
      .then(function(rows){ if(Array.isArray(rows)){ tmp[k]=rows; if(rows.length)okAny=true; } else tmp[k]=[]; done++; step(); })
      .catch(function(){ tmp[k]=STORE[k]||[]; done++; step(); });

function moneyMask(digits){
  digits=(''+digits).replace(/\D/g,'');
  if(!digits) return '';
  digits=digits.replace(/^0+(?=\d)/,'');
  while(digits.length<3) digits='0'+digits;
  var cents=digits.slice(-2), intPart=digits.slice(0,-2);
  intPart=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return intPart+','+cents;
}

}

function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ if(!a||!b)return null; var d1=new Date(a),d2=new Date(b); return Math.round((d2-d1)/86400000); }
function addMonths(iso,m){ if(!iso)return ''; var d=new Date((''+iso).slice(0,10)); if(isNaN(d.getTime()))return ''; d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); }
function addDays(iso,n){ if(!iso)return ''; var d=new Date((''+iso).slice(0,10)); if(isNaN(d.getTime()))return ''; d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function subBusinessDays(iso,n){
  if(!iso)return ''; var d=new Date((''+iso).slice(0,10)); if(isNaN(d.getTime()))return '';
  var left=n;
  while(left>0){ d.setDate(d.getDate()-1); var wd=d.getDay(); if(wd!==0&&wd!==6) left--; }
  return d.toISOString().slice(0,10);
}
function nextBusinessDay(iso){
  if(!iso)return ''; var d=new Date((''+iso).slice(0,10)); if(isNaN(d.getTime()))return '';
  d.setDate(d.getDate()+1);
  while(d.getDay()===0||d.getDay()===6){ d.setDate(d.getDate()+1); }
  return d.toISOString().slice(0,10);
}

function vencInfo(c,def){
  var base=c[def.key];
  if(!base||!isISODate(base)) return {real:'',val:'',st:{cls:'c-mut',label:'—'}};
  var val=addMonths(base,def.meses);

/* status de vencimentos de um colaborador (para alertas) — respeita efetivação da experiência */
function colabTemAlerta(c){
  for(var i=0;i<NR_DEFS.length;i++){ var vi=vencInfo(c,NR_DEFS[i]); if(vi.st.cls==='c-crit'||vi.st.cls==='c-warn') return true; }
  if(!isYes(c.exp_efetivado)){
    if(!isYes(c.exp_cont_45)){
      var s45=vencStatus(addDays(c.admissao,45)); if(s45.cls==='c-crit'||s45.cls==='c-warn') return true;
    }
    var s90=vencStatus(addDays(c.admissao,90)); if(s90.cls==='c-crit'||s90.cls==='c-warn') return true;
  }

/* junta, pra um colaborador, a lista de itens vencidos/vencendo (ASO, NRs, período de experiência) */
function colabItensVencidos(c){
  var itens=[];
  NR_DEFS.forEach(function(def){
    var vi=vencInfo(c,def);
    if(vi.st.cls==='c-crit'||vi.st.cls==='c-warn'){
      itens.push({label:def.label,real:vi.real,val:vi.val,status:vi.st.label,cls:vi.st.cls});
    }
  });
  if(!isYes(c.exp_efetivado)){
    if(!isYes(c.exp_cont_45)){
      var d45=addDays(c.admissao,45), s45=vencStatus(d45);
      if(s45.cls==='c-crit'||s45.cls==='c-warn') itens.push({label:'1º período experiência (45d)',real:c.admissao,val:d45,status:s45.label,cls:s45.cls});
    }
    var d90=addDays(c.admissao,90), s90=vencStatus(d90);
    if(s90.cls==='c-crit'||s90.cls==='c-warn') itens.push({label:'Fim experiência (90d)',real:c.admissao,val:d90,status:s90.label,cls:s90.cls});
  }
  return itens;
}

/* vencimento status: retorna {cls,label,dias} baseado numa data alvo */
function anoValido(iso){ var y=parseInt((''+iso).slice(0,4),10); return !isNaN(y)&&y>=1900&&y<=2100; }
function vencStatus(dateIso){
  if(!dateIso) return {cls:'c-mut',label:'—'};
  if(!anoValido(dateIso)) return {cls:'c-warn',label:'⚠ data inválida'};
  var dd = daysBetween(today(), (''+dateIso).slice(0,10));
  if(dd===null) return {cls:'c-mut',label:'—'};
  if(dd<0) return {cls:'c-crit',label:'Vencido '+(-dd)+'d'};
  if(dd===0) return {cls:'c-warn',label:'Vence hoje'};
  if(dd<=30) return {cls:'c-warn',label:'Vence em '+dd+'d'};
  return {cls:'c-ok',label:'OK ('+dd+'d)'};
}

function esc(s){ if(s===null||s===undefined)return''; return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* 5º dia útil do mês, contando sábado como dia útil (só domingo não conta) */
function quintoDiaUtil(y,m){
  var d=new Date(Date.UTC(y,m,1)), count=0;
  while(true){
    if(d.getUTCDay()!==0){ count++; if(count===5) break; }
    d.setUTCDate(d.getUTCDate()+1);
  }
  return d.toISOString().slice(0,10);
}
/* Sábado ou domingo: pagamento precisa ser adiantado para a sexta-feira anterior */
function weekendAdjustIso(iso){
  if(!iso) return {iso:iso,moved:false};
  var d=new Date((''+iso).slice(0,10)+'T00:00:00');
  if(isNaN(d.getTime())) return {iso:iso,moved:false};
  var wd=d.getDay();
  if(wd===6){ d.setDate(d.getDate()-1); return {iso:d.toISOString().slice(0,10),moved:true}; } // sábado -> sexta
  if(wd===0){ d.setDate(d.getDate()-2); return {iso:d.toISOString().slice(0,10),moved:true}; } // domingo -> sexta
  return {iso:iso,moved:false};
}
function calendarEventsForMonth(){
  var map={}, tdy=today();
  function statusCls(vencIso,paid){
    if(paid) return 'cal-event-paid';
    var dd=daysBetween(tdy,(''+(vencIso||'')).slice(0,10));
    if(dd===null) return '';
    if(dd<0) return 'cal-event-late';
    if(dd===0) return 'cal-event-warn';
    return '';
  }
  function add(iso,desc,cls,valor,empresa){
    if(!iso) return; iso=(''+iso).slice(0,10); if(!isISODate(iso)) return;
    var adj=weekendAdjustIso(iso);
    var finalCls=cls||'';
    var calLabel=desc+' - '+(money(valor)||'—');
    var descOnly=desc;
    if(adj.moved){
      finalCls=(finalCls?finalCls+' ':'')+'cal-event-antecip';
      var nota=' (adiantado — vencia em '+fmtD(iso)+', fim de semana)';
      calLabel='⏩ '+calLabel+nota;
      descOnly='⏩ '+desc+nota;
    }
    if(!map[adj.iso]) map[adj.iso]=[]; map[adj.iso].push({label:calLabel,desc:descOnly,cls:finalCls,valor:num(valor),empresa:empresa||'',antecip:adj.moved,origIso:iso});
  }
  (STORE.ferias||[]).forEach(function(r){ if(!r.colaborador&&!r.vencimento) return; var paid=isYes(r.pasta); add(r.vencimento,'FÉRIAS - '+(r.colaborador||'—'),statusCls(r.vencimento,paid),r.valor,r.empresa); });
  (STORE.rescisoes||[]).forEach(function(r){
    if(!r.colaborador&&!r.vencimento) return;
    var pinfo=parcelasInfo(r);
    if(pinfo){
      /* parcelado (Acordo PJ): uma entrada por parcela, cada uma com seu valor e vencimento */
      parseParcelas(r.parcelas_pj).forEach(function(p,i){
        add(p.vencimento,'TRCT (parcela '+(i+1)+'/'+pinfo.total+') - '+(r.colaborador||'—'),statusCls(p.vencimento,isYes(p.pago)),p.valor,r.empresa);
      });
      /* a multa não parcela — vence sempre 10 dias após o desligamento (mesma data de r.vencimento) */
      if(isYes(r.multa_rescisoria) && num(r.valor_multa_rescisoria)>0){
        add(r.vencimento,'MULTA RESCISÓRIA - '+(r.colaborador||'—'),statusCls(r.vencimento,isYes(r.multa_paga)),r.valor_multa_rescisoria,r.empresa);
      }
    } else {
      add(r.vencimento,(r.tipo_doc||'TRCT')+' - '+(r.colaborador||'—'),statusCls(r.vencimento,isYes(r.pasta)),rescTotal(r),r.empresa);
    }
  });
  (STORE.custos||[]).forEach(function(r){ if(!r.vencimento) return; var paid=isYes(r.pasta); add(r.vencimento,'CUSTO'+(r.descricao?(' - '+r.descricao):''),statusCls(r.vencimento,paid),r.valor,r.empresa); });
  return map;
}
function calNav(delta){
  CAL_MONTH+=delta;
  if(CAL_MONTH<0){ CAL_MONTH=11; CAL_YEAR--; }
  if(CAL_MONTH>11){ CAL_MONTH=0; CAL_YEAR++; }
  render();
}
function calToday(){ CAL_YEAR=CAL_TODAY.getFullYear(); CAL_MONTH=CAL_TODAY.getMonth(); render(); }
function viewCalendario(){
  var monthNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var y=CAL_YEAR, m=CAL_MONTH;
  var h='';
  h+='<div class="toolbar" style="justify-content:space-between">';
  h+='<div class="flex" style="gap:10px;align-items:center">';
  h+='<button class="btn ghost sm" onclick="calNav(-1)">◀</button>';
  h+='<h2 style="margin:0;min-width:200px;text-align:center">'+monthNames[m]+' de '+y+'</h2>';
  h+='<button class="btn ghost sm" onclick="calNav(1)">▶</button>';
  h+='</div>';
  h+='<button class="btn ghost sm" onclick="calToday()">Hoje</button>';
  h+='</div>';
  h+='<div class="muted" style="font-size:12px;margin-bottom:12px">🟨 Dia grifado = 5º dia útil do mês (contando sábado como dia útil, só domingo não conta). <span style="color:var(--grn)">🟩 Verde</span> = pagamento OK · <span style="color:var(--amber)">🟧 Âmbar</span> = vence hoje · <span style="color:var(--red2)">🟥 Vermelho</span> = vencido sem pagar · <span style="color:var(--violet)">🟪 Roxo (borda) ⏩</span> = vencimento caía em sábado/domingo e foi adiantado automaticamente para a sexta-feira anterior. Rescisão parcelada (Acordo PJ) aparece com uma entrada por parcela + a multa separada (ela não parcela — vence sempre 10 dias após o desligamento). O total de cada dia aparece no rodapé da célula e também ao passar o mouse sobre o dia.</div>';

  var q5=quintoDiaUtil(y,m);
  var events=calendarEventsForMonth();
  var firstDow=new Date(Date.UTC(y,m,1)).getUTCDay();
  var daysInMonth=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  var tdy=today();
  var monthTotal=0;

  h+='<div class="cal-grid">';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(function(d){ h+='<div class="cal-dow">'+d+'</div>'; });
  for(var i=0;i<firstDow;i++) h+='<div class="cal-cell cal-empty"></div>';
  for(var day=1;day<=daysInMonth;day++){
    var iso=y+'-'+pad2(m+1)+'-'+pad2(day);
    var isQ5=(iso===q5), isToday=(iso===tdy);
    var evs=events[iso];
    var dayTotal=0;
    if(evs) evs.forEach(function(e){ dayTotal+=num(e.valor); });
    monthTotal+=dayTotal;
    var titleAttr=dayTotal?(' title="Total do dia '+pad2(day)+'/'+pad2(m+1)+': '+money(dayTotal)+'"'):'';
    h+='<div class="cal-cell'+(isQ5?' cal-q5':'')+(isToday?' cal-today':'')+'"'+titleAttr+'>';
    h+='<div class="cal-daynum">'+day+(isQ5?' <span class="chip c-warn" style="padding:1px 5px;font-size:9px;margin-left:3px">5º dia útil</span>':'')+'</div>';
    if(evs) evs.forEach(function(e){ h+='<div class="cal-event'+(e.cls?(' '+e.cls):'')+'">'+esc(e.label)+'</div>'; });
    if(dayTotal) h+='<div class="cal-daytotal">Total: '+money(dayTotal)+'</div>';
    h+='</div>';
  }
  var rem=(7-((firstDow+daysInMonth)%7))%7;
  for(var j=0;j<rem;j++) h+='<div class="cal-cell cal-empty"></div>';
  h+='</div>';

  h+='<div class="card" style="margin-top:16px">';
  h+='<div class="xrow"><div><div class="section-title">💰 Total do mês exibido</div><div class="muted" style="font-size:12px">Somatório de todos os vencimentos (férias, rescisões e custos) de '+monthNames[m]+' de '+y+'</div></div>'+
     '<div style="font-size:22px;font-weight:800">'+money(monthTotal)+'</div></div>';
  h+='</div>';

  h+='<div class="card" style="margin-top:16px">';
  h+='<div class="section-title">📄 PDF por período</div>';
  h+='<div class="muted" style="font-size:12px;margin-bottom:10px">Escolha um período (dia, mês e ano de início e fim) e gere um PDF com a descrição e o valor de cada vencimento no intervalo, além do valor total somado.</div>';
  h+='<div class="flex" style="align-items:flex-end;gap:12px">'+
     '<label class="fl">De'+dateTrio('calFrom','',"")+'</label>'+
     '<label class="fl">Até'+dateTrio('calTo','',"")+'</label>'+
     '<button class="btn" onclick="pdfPeriodo()">⬇ Gerar PDF do período</button>'+
     '</div>';
  h+='</div>';
  return h;
}

function colabFilteredList(){
  var q=(document.getElementById('colabSearch')||{}).value||'';
  var emp=(document.getElementById('colabEmp')||{}).value||'';
  var setor=(document.getElementById('colabSetorFiltro')||{}).value||'';
  q=q.toLowerCase();
  var base=STORE.colaboradores.filter(function(c){ return (COLAB_STATUS==='inativos')? !isColabAtivo(c) : isColabAtivo(c); });
  return base.filter(function(c){
    if(COLAB_ALERT_FILTER && !colabTemAlerta(c))return false;
    if(emp && c.empresa!==emp)return false;
    if(setor && c.setor!==setor)return false;
    if(!q)return true;
    return ((c.nome||'')+' '+(canSens()?(c.cpf||''):'')+' '+(c.funcao||'')).toLowerCase().indexOf(q)>=0;
  });
}

/* Migra o antigo campo único "emergencia" (ex.: "VANESSA (FILHA) 11 95580-3606")
   para os 3 campos separados, só quando eles ainda estiverem vazios. Não salva
   sozinho — só preenche em memória; a gravação acontece quando o usuário edita
   ou clica em Salvar. */
function migrateEmergencia(c){
  if(!c || (c.emergencia_nome||c.emergencia_parentesco||c.emergencia_telefone)) return;
  var old=(c.emergencia||'').trim(); if(!old) return;
  var m=old.match(/^(.*?)\(([^)]*)\)\s*(.*)$/);
  if(m){
    c.emergencia_nome=(m[1]||'').trim();
    c.emergencia_parentesco=(m[2]||'').trim();
    c.emergencia_telefone=(m[3]||'').trim();
  } else {
    c.emergencia_nome=old;
  }
}
function colabFotoBox(c){
  var inner = c.foto
    ? '<img src="'+esc(c.foto)+'" alt="">'
    : '👤';
  var h='<div class="fotobox">';
  h+='<div class="circ" title="Clique para adicionar/trocar a foto" onclick="document.getElementById(\'fotoInput\').click()">'+inner+'</div>';
  h+='<input type="file" id="fotoInput" accept="image/*" onchange="handleFotoUpload(\''+c.id+'\',this)">';
  if(c.foto) h+='<div class="rm" title="Remover foto" onclick="event.stopPropagation();removerFoto(\''+c.id+'\')">×</div>';
  h+='</div>';
  return h;
}
function handleFotoUpload(id,input){
  var file=input.files&&input.files[0]; if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var maxDim=320;
      var w=img.width,hh=img.height;
      if(w>hh && w>maxDim){ hh=Math.round(hh*maxDim/w); w=maxDim; }
      else if(hh>maxDim){ w=Math.round(w*maxDim/hh); hh=maxDim; }
      var canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=hh;
      canvas.getContext('2d').drawImage(img,0,0,w,hh);
      var dataUrl=canvas.toDataURL('image/jpeg',0.82);
      upd('colaboradores',id,'foto',dataUrl);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function removerFoto(id){ upd('colaboradores',id,'foto',''); }
/* ===== Campo de data robusto: DD / MM / AAAA em 3 caixas separadas =====
   Substitui o <input type="date"> nativo, que em vários navegadores/celulares
   embaralha a digitação do ano. Cada caixa só aceita números, avança sozinha
   para a próxima ao completar, volta com Backspace quando vazia, seleciona
   tudo ao focar (para sobrescrever direto) e aceita colar uma data inteira. */
function dateTrio(wrapId,value,onchangeCode,disabled,err){
  var dis=disabled?' disabled':'';
  var v=(''+(value||'')).slice(0,10);
  var pd='',pm='',pa='';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ pa=v.slice(0,4); pm=v.slice(5,7); pd=v.slice(8,10); }
  var idAttr=wrapId?' id="'+esc(wrapId)+'"':'';
  var common=' inputmode="numeric" pattern="[0-9]*" autocomplete="off" onfocus="this.select()" onkeydown="dtKeydown(event,this)"'+dis;
  return '<div class="datetrio'+(err?' err':'')+'"'+idAttr+' data-onchange="'+esc(onchangeCode||'')+'" onpaste="dtPaste(event,this)">'+
    '<input type="text" maxlength="2" class="dtd" aria-label="Dia" placeholder="00" value="'+esc(pd)+'" oninput="dtInput(this,2)"'+common+'>'+
    '<span class="dtsep">/</span>'+
    '<input type="text" maxlength="2" class="dtm" aria-label="Mês" placeholder="00" value="'+esc(pm)+'" oninput="dtInput(this,2)"'+common+'>'+
    '<span class="dtsep">/</span>'+
    '<input type="text" maxlength="4" class="dta" aria-label="Ano" placeholder="0000" value="'+esc(pa)+'" oninput="dtInput(this,4)"'+common+'>'+
  '</div>';
}
function dtInput(el,max){
  var digits=el.value.replace(/\D/g,'').slice(0,max);
  el.value=digits;
  if(digits.length===max){
    var next=dtSibling(el,1);
    if(next){ next.focus(); next.select(); }
  }
  dtSync(el);
}
function dtKeydown(ev,el){
  if(ev.key==='Backspace' && el.value===''){
    var prev=dtSibling(el,-1);
    if(prev){ ev.preventDefault(); prev.value=prev.value.slice(0,-1); prev.focus(); dtSync(prev); }
    return;
  }
  if((ev.key==='ArrowLeft') && el.selectionStart===0 && el.selectionEnd===0){
    var p=dtSibling(el,-1); if(p){ ev.preventDefault(); p.focus(); p.setSelectionRange(p.value.length,p.value.length); }
    return;
  }
  if((ev.key==='ArrowRight') && el.selectionStart===el.value.length && el.selectionEnd===el.value.length){
    var n=dtSibling(el,1); if(n){ ev.preventDefault(); n.focus(); n.setSelectionRange(0,0); }
    return;
  }
  if(ev.key==='/'||ev.key===' '){
    var n2=dtSibling(el,1); if(n2){ ev.preventDefault(); n2.focus(); n2.select(); }
    return;
  }
}
function dtSibling(el,dir){
  var wrap=el.closest('.datetrio'); if(!wrap) return null;
  var inputs=Array.prototype.slice.call(wrap.querySelectorAll('input'));
  var idx=inputs.indexOf(el);
  var target=inputs[idx+dir];
  return target||null;
}
function dtPaste(ev,wrap){
  var text=(ev.clipboardData||window.clipboardData).getData('text');
  var digits=(text||'').replace(/\D/g,'');
  if(!digits) return;
  ev.preventDefault();
  var inputs=wrap.querySelectorAll('input');
  if(digits.length>=8){
    inputs[0].value=digits.slice(0,2); inputs[1].value=digits.slice(2,4); inputs[2].value=digits.slice(4,8);
  } else if(digits.length===6){
    inputs[0].value=digits.slice(0,2); inputs[1].value=digits.slice(2,4); inputs[2].value='20'+digits.slice(4,6);
  } else {
    var el=ev.target, max=el.className.indexOf('dta')>=0?4:2;
    el.value=digits.slice(0,max);
  }
  dtSync(inputs[2]);
  inputs[2].focus();
}
function dtReadISO(wrap){
  if(typeof wrap==='string') wrap=document.getElementById(wrap);
  if(!wrap) return '';
  var ddEl=wrap.querySelector('.dtd'),mmEl=wrap.querySelector('.dtm'),aaEl=wrap.querySelector('.dta');
  if(!ddEl||!mmEl||!aaEl) return '';
  var dd=ddEl.value,mm=mmEl.value,aa=aaEl.value;
  if(!dd||!mm||!aa||(''+aa).length<4) return '';
  var ddN=parseInt(dd,10),mmN=parseInt(mm,10),aaN=parseInt(aa,10);
  if(!ddN||!mmN||!aaN) return '';
  var iso=aaN+'-'+('0'+mmN).slice(-2)+'-'+('0'+ddN).slice(-2);
  var chk=new Date(iso+'T00:00:00');
  if(isNaN(chk.getTime())||chk.getDate()!==ddN||(chk.getMonth()+1)!==mmN) return '';
  return iso;
}
function dtClear(wrapId){
  var wrap=document.getElementById(wrapId); if(!wrap)return;
  ['.dtd','.dtm','.dta'].forEach(function(s){ var e=wrap.querySelector(s); if(e)e.value=''; });
}
function dtSync(el){
  var wrap=el.closest('.datetrio'); if(!wrap) return;
  var iso=dtReadISO(wrap); if(!iso) return;
  var code=wrap.getAttribute('data-onchange'); if(!code) return;
  try{ (new Function('value',code))(iso); }catch(e){ console.error('dtSync',e); }
}

function salvarColabAgora(id){

  if(missing.length>0){

    btn=document.getElementById('btnSalvarColab');
    if(btn){ btn.textContent='🚫 Faltam dados!'; btn.classList.add('savebtn-err'); }
    var hint2=document.getElementById('savehint');
    if(hint2){ hint2.textContent='Preencha os campos obrigatórios em vermelho'; }
    setTimeout(function(){
      var b=document.getElementById('btnSalvarColab');
      if(b){ b.textContent='💾 Salvar'; b.classList.remove('savebtn-err'); }
    },2500);
    return;

  persist('colaboradores',r);
  if(btn){ btn.textContent='✓ Salvo!'; btn.classList.add('savebtn-ok'); }
  if(hint){ hint.textContent='Salvo agora'; }
  setTimeout(function(){

    if(hint){ hint.textContent='Alterações salvas automaticamente'; }
  },2000);
}

function normname(s){ return (''+(s||'')).toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-zà-ú ]/gi,'').replace(/\s+/g,' ').trim(); }
function feriasStatus(){
  var regs=STORE.ferias, ativas=[], agendadas=[];
  var tdy=today();
  // ativas: em gozo hoje E já pago (comprovante salvo na pasta)
  regs.forEach(function(r){ var i=(''+(r.inicio||'')).slice(0,10), f=(''+(r.fim||'')).slice(0,10); if(i&&f&&i<=tdy&&tdy<=f&&isYes(r.pasta)) ativas.push(r); });
  // agendadas: ainda não pagas (comprovante não salvo na pasta)
  regs.forEach(function(r){ if(!isYes(r.pasta)) agendadas.push(r); });
  // ordena agendadas por vencimento (mais próximo primeiro); em empate, por nome do colaborador
  agendadas.sort(function(a,b){
    var d=(''+(a.vencimento||'')).localeCompare(''+(b.vencimento||''));
    return d!==0 ? d : (''+(a.colaborador||'')).localeCompare(''+(b.colaborador||''));
  });
  // ordena ativas por data de retorno (fim, mais próximo primeiro); em empate, por nome
  ativas.sort(function(a,b){
    var d=(''+(a.fim||'')).localeCompare(''+(b.fim||''));
    return d!==0 ? d : (''+(a.colaborador||'')).localeCompare(''+(b.colaborador||''));
  });
  return {ativas:ativas,agendadas:agendadas,reg:regs.length};
}

/* ================= 💸 PIX DO FREELANCER + MENSAGEM DE CONFIRMAÇÃO (WhatsApp) =================
   O painel é um arquivo HTML: ele não dispara WhatsApp sozinho em segundo plano.
   Ele abre o WhatsApp (Web ou app) com a mensagem JÁ ESCRITA para o número do freelancer —
   basta clicar em Enviar. Com a opção "sempre" ligada, isso acontece automaticamente
   toda vez que uma chave PIX é cadastrada ou alterada. */
var PIX_TIPOS=['CPF','CNPJ','Telefone','E-mail','Chave aleatória'];
var PIX_TPL_PADRAO='Olá, {primeiro_nome}! Tudo bem?\nAqui é do Departamento Pessoal da ILED Produções.\n\nPara o pagamento do seu cachê{evento_txt}, poderia confirmar se a chave PIX abaixo está correta?\n\n*Chave PIX ({tipo}):* {pix}\n*Titular:* {nome}\n\n{confirmacao}\n\nObrigado!';
function pixAutoOn(){ try{ return window.localStorage.getItem('dp_iled_pix_auto')!=='0'; }catch(e){ return true; } }
function setPixAuto(on){ try{ window.localStorage.setItem('dp_iled_pix_auto',on?'1':'0'); }catch(e){} }
function pixTpl(){ try{ return window.localStorage.getItem('dp_iled_pix_tpl')||PIX_TPL_PADRAO; }catch(e){ return PIX_TPL_PADRAO; } }
function setPixTpl(v){ try{ if(!v||v===PIX_TPL_PADRAO) window.localStorage.removeItem('dp_iled_pix_tpl'); else window.localStorage.setItem('dp_iled_pix_tpl',v); }catch(e){} }
function waFone(tel){
  var d=(''+(tel||'')).replace(/\D/g,'');
  if(d.indexOf('00')===0) d=d.slice(2);
  if(d.length===10||d.length===11) d='55'+d;
  return (d.length>=12&&d.length<=13)?d:'';
}
/* evento mais recente do freelancer (para citar na mensagem) */
function freelUltEvento(f){
  var evs=(f.eventos||[]).slice().sort(function(a,b){ return (''+(b.periodo_inicio||'')).localeCompare(''+(a.periodo_inicio||'')); });
  return evs[0]||null;
}
function pixMensagem(f){
  var ev=freelUltEvento(f), nome=(''+(f.nome||'')).trim();
  var primeiro=nome.split(/\s+/)[0]||nome;
  primeiro=primeiro.charAt(0).toUpperCase()+primeiro.slice(1).toLowerCase();
  var vars={
    nome:nome, primeiro_nome:primeiro, pix:f.pix||'', tipo:f.pix_tipo||'chave',
    evento:ev?evNome(ev):'', evento_txt:ev&&evNome(ev)?' referente ao evento *'+evNome(ev)+'*':'',
    valor:ev&&ev.valor?money(evTotal(ev)):'', data:ev&&ev.periodo_inicio?fmtD(ev.periodo_inicio):'',
    link:pixLink(f),
    confirmacao:pixLink(f)?'*Para confirmar (ou corrigir) sua chave, toque no link abaixo:*\n'+pixLink(f):'Responda *SIM* para confirmar ou nos envie a chave correta.'
  };
  var tpl=pixTpl();
  // mensagens salvas no formato antigo: troca o "Responda SIM" pelo link de confirmação
  tpl=tpl.replace(/Responda \*?SIM\*? para confirmar ou nos envie a chave correta\.?[ \t]*/,'{confirmacao}\n\n');
  if(vars.link&&tpl.indexOf('{link}')<0&&tpl.indexOf('{confirmacao}')<0) tpl+='\n\nConfirme sua chave aqui: {link}';
  var txt=tpl.replace(/\{(\w+)\}/g,function(m,k){ return vars.hasOwnProperty(k)?vars[k]:m; });
  // remove emojis: o WhatsApp Web/Desktop no Windows costuma trocá-los por "�"
  try{ txt=txt.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,''); }catch(e){}
  return txt.replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n').replace(/ {2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
function pixStatusHTML(f){

  if(f.pix_resp==='corrigir') return '<span class="chip c-warn">✏️ Freelancer pediu correção em '+fmtDateTime(f.pix_resp_em)+'</span>';
  if(f.pix_conf_em) return '<span class="chip c-ok">✅ PIX confirmado em '+fmtDateTime(f.pix_conf_em)+(f.pix_resp==='sim'?' — pelo próprio freelancer (link)':f.pix_resp==='corrigida'?' — chave informada pelo próprio freelancer (link)':f.pix_resp==='manual'?' — marcado pela DP':'')+'</span>';

function pixEnviar(fid,auto){
  var f=find('freelancers',fid); if(!f) return;

  var fone=waFone(f.telefone);

  if(!f.pix_token&&canEditRec('freelancers',fid)){ f.pix_token=genToken(); saveLocal(); persist('freelancers',f); }
  var url='https://api.whatsapp.com/send?phone='+fone+'&text='+encodeURIComponent(pixMensagem(f));
  var w=window.open(url,'_blank');
  if(!w){
    // navegador bloqueou a abertura automática: mostra o botão para um clique
    showWarn('O navegador bloqueou a abertura automática — clique em "💬 Enviar confirmação" na ficha.');

}

/* ================= 🔔 CONFIRMAÇÃO DO PIX POR LINK (sem API do WhatsApp) =================
   1) A mensagem leva um link pessoal (token) para a página confirmar-pix.html
   2) O freelancer toca em "Sim" ou informa outra chave → o Supabase grava (funções pix_consulta/pix_responder)
   3) O painel verifica a cada 40 s e avisa: 🔔 "Fulano confirmou o PIX" */
var DP_CONFIG={}, PIX_AVISOS=[], PIX_NOTIFICADOS={};
function loadDpConfig(cb){
  if(!sbConfigured()){ if(cb)cb(); return; }
  fetch(CFG.url+'/rest/v1/dp_config?select=*',{headers:sbHeaders()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){ DP_CONFIG={}; (rows||[]).forEach(function(r){ DP_CONFIG[r.id]=r.valor; }); if(cb)cb(); })
    .catch(function(){ if(cb)cb(); });
}
function saveDpConfig(id,valor,cb){
  sbUpsert('dp_config',{id:id,valor:valor,atualizado_em:new Date().toISOString()},function(ok,err){ if(ok) DP_CONFIG[id]=valor; if(cb)cb(ok,err); });
}
function pixConfUrl(){ return (''+(DP_CONFIG.pix_conf_url||'')).trim(); }
function genToken(){
  var a='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', t='';
  var arr=null; try{ arr=new Uint32Array(28); window.crypto.getRandomValues(arr); }catch(e){}
  for(var i=0;i<28;i++){ var n=arr?arr[i]:Math.floor(Math.random()*4294967296); t+=a.charAt(n%a.length); }
  return t;
}
function pixLink(f){
  var u=pixConfUrl(); if(!u||!f.pix_token) return '';
  return u+(u.indexOf('?')>=0?'&':'?')+'c='+f.pix_token;
}
/* limpa, no banco, a resposta anterior do freelancer (quando a chave muda ou a DP decide) */
function pixLimparResposta(fid,extra){
  var patch={pix_resp:null,pix_resp_em:null,pix_sugerida:null,pix_sugerida_tipo:null,pix_aviso:false};
  for(var k in (extra||{})) patch[k]=extra[k];
  var f=find('freelancers',fid); if(f){ for(var k2 in patch) f[k2]=patch[k2]; }
  PIX_AVISOS=PIX_AVISOS.filter(function(a){ return a.id!==fid; }); pixBellRender();
  if(sbConfigured()) sbPatch(TBL.freelancers,fid,patch,function(){});
}
function pixAplicarSugerida(fid){
  var f=find('freelancers',fid); if(!f||!f.pix_sugerida) return;
  if(!canEditRec('freelancers',fid)){ permDenied('freelancers','editar'); return; }
  var nova=f.pix_sugerida, tipo=f.pix_sugerida_tipo||f.pix_tipo;
  if(!confirm('Trocar a chave PIX de '+(f.nome||'')+'\n\nDe: '+(f.pix||'—')+'\nPara: '+nova+' ('+(tipo||'')+')\n\nComo foi o próprio freelancer que informou esta chave, ela já fica CONFIRMADA — nenhuma mensagem nova é enviada.')) return;
  window._pixSkipAuto=true;
  try{
    if(tipo) upd('freelancers',fid,'pix_tipo',tipo);
    upd('freelancers',fid,'pix',nova);
  } finally { window._pixSkipAuto=false; }
  var agora=new Date().toISOString();
  logEdit('freelancers',f,'pix_conf_em','',agora);
  pixLimparResposta(fid,{pix_conf_em:agora,pix_resp:'corrigida',pix_resp_em:agora});
  saveLocal();
  if(window._curFreel===fid&&document.getElementById('overlay').className.indexOf('show')>=0) document.getElementById('modal').innerHTML=freelModal(f);
  showWarn('✅ Chave de '+((f.nome||'').split(' ')[0])+' atualizada e confirmada (informada por ele mesmo).');
}
function pixDescartarSugerida(fid){
  if(!canEditRec('freelancers',fid)){ permDenied('freelancers','editar'); return; }
  pixLimparResposta(fid);
  var f=find('freelancers',fid);
  if(f&&window._curFreel===fid) document.getElementById('modal').innerHTML=freelModal(f);
}
function pixCiente(fid){
  var f=find('freelancers',fid);
  PIX_AVISOS=PIX_AVISOS.filter(function(a){ return a.id!==fid; });
  if(f) f.pix_aviso=false;
  if(sbConfigured()) sbPatch(TBL.freelancers,fid,{pix_aviso:false},function(){});
  pixBellRender();
  if(TAB==='freelancers'&&document.getElementById('overlay').className.indexOf('show')<0) render();
}
/* verifica respostas novas no banco */
function pixPoll(){
  if(!CUR_USER||!sbConfigured()||!can('freelancers','ver')) return;
  fetch(CFG.url+'/rest/v1/'+TBL.freelancers+'?select=id,nome,pix_conf_em,pix_resp,pix_resp_em,pix_sugerida,pix_sugerida_tipo,pix_aviso&pix_aviso=eq.true',{headers:sbHeaders()})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(rows){
      if(!Array.isArray(rows)) return;
      var novos=[];
      rows.forEach(function(r){
        var f=find('freelancers',r.id);
        if(f){ ['pix_conf_em','pix_resp','pix_resp_em','pix_sugerida','pix_sugerida_tipo','pix_aviso'].forEach(function(k){ f[k]=r[k]; }); }
        var chave=r.id+'|'+r.pix_resp_em;
        if(!PIX_NOTIFICADOS[chave]){ PIX_NOTIFICADOS[chave]=1; novos.push(r); }
      });
      PIX_AVISOS=rows.sort(function(a,b){ return (''+b.pix_resp_em).localeCompare(''+a.pix_resp_em); });
      pixBellRender();
      if(novos.length){
        novos.forEach(function(r,i){
          setTimeout(function(){

/* ================= FREELANCERS — BANCO DE DADOS com HISTÓRICO DE EVENTOS =================
   Cada freelancer tem os dados pessoais + uma lista de EVENTOS trabalhados (f.eventos),
   cada um com seu próprio estado (UF), local, função, período e cachê.
   Filtro por Estado (UF) OU por Evento vale para os cards, o relatório, o PDF e a planilha. */
var UF_LIST=[['AC','Acre'],['AL','Alagoas'],['AP','Amapá'],['AM','Amazonas'],['BA','Bahia'],['CE','Ceará'],['DF','Distrito Federal'],
  ['ES','Espírito Santo'],['GO','Goiás'],['MA','Maranhão'],['MT','Mato Grosso'],['MS','Mato Grosso do Sul'],['MG','Minas Gerais'],
  ['PA','Pará'],['PB','Paraíba'],['PR','Paraná'],['PE','Pernambuco'],['PI','Piauí'],['RJ','Rio de Janeiro'],['RN','Rio Grande do Norte'],
  ['RS','Rio Grande do Sul'],['RO','Rondônia'],['RR','Roraima'],['SC','Santa Catarina'],['SP','São Paulo'],['SE','Sergipe'],['TO','Tocantins']];
function ufNome(uf){ for(var i=0;i<UF_LIST.length;i++){ if(UF_LIST[i][0]===uf) return UF_LIST[i][1]; } return uf||''; }
var FREEL_NR_DEFS=NR_DEFS.filter(function(d){ return d.key.indexOf('nr')===0; });
var FREEL_SUB='dados';                 // sub-aba do modal

/* campos obrigatórios do freelancer — a ficha não fecha sem eles */
var FREEL_REQ=[

/* ---------- estrutura de eventos (com migração do formato antigo de 1 evento) ---------- */
var EV_KEYS=['evento','estado','local','funcao','periodo_inicio','periodo_fim','valor'];
function normFreel(f){
  if(typeof f.eventos==='string'){ try{ f.eventos=JSON.parse(f.eventos); }catch(e){ f.eventos=[]; } }
  if(!Array.isArray(f.eventos)) f.eventos=[];
  if(!f.eventos.length && (f.evento||f.local||f.estado||f.valor||f.periodo_inicio||f.periodo_fim||f.funcao)){
    var ev={id:uid()}; EV_KEYS.forEach(function(k){ ev[k]=f[k]===undefined?null:f[k]; });
    f.eventos.push(ev);
  }
  // os campos antigos de evento "de nível superior" deixam de ser usados
  EV_KEYS.forEach(function(k){ if(f[k]!==undefined) f[k]=null; });
  return f;
}
function normFreelAll(){ (STORE.freelancers||[]).forEach(normFreel); }
function evTotal(ev){ return evNum(ev&&ev.valor)*evQtd(ev); }
function evNum(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function evDias(ev){
  if(!ev.periodo_inicio||!ev.periodo_fim) return '';
  var d=daysBetween((''+ev.periodo_inicio).slice(0,10),(''+ev.periodo_fim).slice(0,10));
  return (d!==null&&d>=0)?(d+1):'';
}
function evPeriodo(ev){
  var i=ev.periodo_inicio, e=ev.periodo_fim;
  if(!i&&!e) return '';
  if(i&&e){ var d=evDias(ev); return fmtD(i)+' → '+fmtD(e)+(d?' ('+d+' dia'+(d>1?'s':'')+')':''); }
  return fmtD(i||e);
}
function evQtd(ev){ var n=parseInt(ev&&ev.qtd_pessoas,10); return (isNaN(n)||n<1)?1:n; }
function evNome(ev){ return (''+(ev.evento||'')).trim(); }
function evKey(ev){ return evNome(ev).toUpperCase(); }
/* lista de eventos já usados (para o filtro e o autocompletar) */
function eventosUsados(){
  var m={}; (STORE.freelancers||[]).forEach(function(f){ (f.eventos||[]).forEach(function(ev){ var k=evKey(ev); if(k&&!m[k]) m[k]=evNome(ev); }); });
  return Object.keys(m).sort().map(function(k){ return m[k]; });
}
function ufsUsados(){
  var m={}; (STORE.freelancers||[]).forEach(function(f){ (f.eventos||[]).forEach(function(ev){ if(ev.estado) m[ev.estado]=1; }); });
  return Object.keys(m).sort();
}
function locaisUsados(){
  var m={}; (STORE.freelancers||[]).forEach(function(f){ (f.eventos||[]).forEach(function(ev){ var l=(''+(ev.local||'')).trim(); if(l) m[l.toUpperCase()]=l; }); });
  return Object.keys(m).sort().map(function(k){ return m[k]; });
}
/* o evento passa no filtro atual (UF ou Evento + período)? */
function evPassa(ev){
  var F=FREEL_FILTRO;
  if(F.valor){
    if(F.modo==='uf' && (ev.estado||'')!==F.valor) return false;
    if(F.modo==='evento' && evKey(ev)!==F.valor.toUpperCase()) return false;
  }
  var ini=(''+(ev.periodo_inicio||ev.periodo_fim||'')).slice(0,10);
  if(F.de && (!ini||ini<F.de)) return false;
  if(F.ate && (!ini||ini>F.ate)) return false;
  return true;
}
function freelBusca(f,q){
  if(!q) return true;
  var txt=[f.nome,canSens()?f.cpf:'',canSens()?f.pix:'',f.mei,f.endereco,f.telefone];
  (f.eventos||[]).forEach(function(ev){ txt.push(ev.evento,ev.local,ev.funcao,ev.estado,ufNome(ev.estado),ev.equipe_obs); });
  return txt.join(' ').toLowerCase().indexOf(q)>=0;
}
/* linhas do relatório: uma por participação (freelancer × evento) já filtradas */
function freelLinhas(){
  var q=((document.getElementById('freelSearch')||{}).value||FREEL_Q||'').toLowerCase();
  var out=[];
  (STORE.freelancers||[]).forEach(function(f){
    if(!freelBusca(f,q)) return;
    (f.eventos||[]).forEach(function(ev){ if(evPassa(ev)) out.push({f:f,ev:ev}); });
  });
  out.sort(function(a,b){
    var g=FREEL_FILTRO.modo==='uf'?(a.ev.estado||'~').localeCompare(b.ev.estado||'~'):evKey(a.ev).localeCompare(evKey(b.ev));
    if(g) return g;
    var d=(''+(a.ev.periodo_inicio||'')).localeCompare(''+(b.ev.periodo_inicio||''));
    return d||(a.f.nome||'').localeCompare(b.f.nome||'');
  });
  return out;
}
var FREEL_Q='';
function freelFiltroDesc(){
  var F=FREEL_FILTRO, p=[];
  if(F.valor) p.push(F.modo==='uf'?'Estado: '+F.valor+' — '+ufNome(F.valor):'Evento: '+F.valor);
  else p.push(F.modo==='uf'?'Todos os estados':'Todos os eventos');
  if(F.de||F.ate) p.push('Período: '+(F.de?fmtD(F.de):'…')+' a '+(F.ate?fmtD(F.ate):'…'));
  if(FREEL_Q) p.push('Busca: "'+FREEL_Q+'"');
  return p.join(' · ');
}

/* ---------- EXPORTAÇÃO: PLANILHA EXCEL (.xlsx, com CSV de reserva) ---------- */
function freelNomeArquivo(ext){
  var F=FREEL_FILTRO, base='freelancers_'+(F.valor?(F.modo==='uf'?'UF-'+F.valor:'evento-'+F.valor):(F.modo==='uf'?'todos-estados':'todos-eventos'));
  base=base.normalize?base.normalize('NFD').replace(/[\u0300-\u036f]/g,''):base;
  return base.replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,70)+'_'+today()+'.'+ext;
}
function freelPlanilhaDados(){
  normFreelAll();
  var linhas=freelLinhas(), sens=canSens();
  var cab=['Freelancer'].concat(sens?['CPF']:[]).concat(['Data de nascimento','Telefone','MEI (CNPJ)','Endereço','Estado (UF)','Evento','Função','Qtd. pessoas (ele + equipe)','Equipe / observação']).concat(sens?['Cachê por pessoa (R$)','Total do evento (R$)','Tipo PIX','Chave PIX','PIX confirmado']:[]);
  var det=[['Relatório de Freelancers — DP ILED'],['Filtro: '+freelFiltroDesc()],['Gerado em '+fmtDateTime(new Date().toISOString())+' por '+getUserName()],[],cab];
  linhas.forEach(function(l){
    var r=[l.f.nome||''];
    if(sens) r.push(l.f.cpf||'');
    r=r.concat([fmtD(l.f.nascimento),l.f.telefone||'',l.f.mei||'',l.f.endereco||'',l.ev.estado||'',evNome(l.ev),l.ev.funcao||'',evQtd(l.ev),l.ev.equipe_obs||'']);
    if(sens){ r.push(evNum(l.ev.valor)||''); r.push(evTotal(l.ev)||''); r.push(l.f.pix_tipo||''); r.push(l.f.pix||''); r.push(l.f.pix_conf_em?'Sim — '+fmtDateTime(l.f.pix_conf_em):(l.f.pix?'Não':'')); }
    det.push(r);
  });
  var tot=0, qtd=0; linhas.forEach(function(l){ tot+=evTotal(l.ev); qtd+=evQtd(l.ev); });
  if(linhas.length){ var t=new Array(cab.length).fill(''); t[0]='TOTAL GERAL'; t[cab.indexOf('Qtd. pessoas (ele + equipe)')]=qtd; if(sens) t[cab.indexOf('Total do evento (R$)')]=tot; det.push([]); det.push(t); }
  var res=[['Resumo — '+(FREEL_FILTRO.modo==='uf'?'por Estado (UF)':'por Evento')],['Filtro: '+freelFiltroDesc()],[],
    [FREEL_FILTRO.modo==='uf'?'Estado (UF)':'Evento','Pessoas totais no local','Freelancers contratados','Da equipe deles'].concat(sens?['Total de cachês (R$)']:[])];
  freelGrupos(linhas).forEach(function(g){ res.push([freelGrupoTitulo(g),g.qtd,Object.keys(g.pessoas).length,g.qtd-g.linhas.length].concat(sens?[g.tot]:[])); });
  return {det:det,res:res,cab:cab,sens:sens};
}
function freelXLSX(){
  var d=freelPlanilhaDados();
  function gerar(){
    try{
      var wb=XLSX.utils.book_new();
      var ws=XLSX.utils.aoa_to_sheet(d.det);
      ws['!cols']=d.cab.map(function(c){ return {wch:Math.max(12,Math.min(38,c.length+6))}; });
      ws['!cols'][0]={wch:36};
      XLSX.utils.book_append_sheet(wb,ws,'Detalhe');
      var ws2=XLSX.utils.aoa_to_sheet(d.res); ws2['!cols']=[{wch:40},{wch:22},{wch:22},{wch:16},{wch:20}];
      XLSX.utils.book_append_sheet(wb,ws2,'Resumo');
      XLSX.writeFile(wb,freelNomeArquivo('xlsx'));
    }catch(e){ console.warn(e); freelCSV(d); }
  }
  if(window.XLSX) return gerar();
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=gerar;
  s.onerror=function(){ showWarn('Sem acesso à biblioteca do Excel — baixando em CSV (abre no Excel também).'); freelCSV(d); };
  document.head.appendChild(s);
}
function freelCSV(d){
  d=d||freelPlanilhaDados();
  var csv=d.det.map(function(r){ return r.map(function(c){ var v=(typeof c==='number')?(''+c).replace('.',','):(''+(c===undefined||c===null?'':c)); return '"'+v.replace(/"/g,'""')+'"'; }).join(';'); }).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=freelNomeArquivo('csv'); document.body.appendChild(a); a.click(); a.remove();
}

function newFreel(){

  var F=FREEL_FILTRO;

}
function openFreel(id){

}

function ffld(f,key,label,type){
  type=type||'text';
  if(sensHidden('freelancers',key,f.id)) return sensBox(label);

  var isReq=!!FREEL_MISS_MAP[key], cls='fl'+(isReq?' fl-err':''), mk=freelReqMark(key);

    var code="upd('freelancers','"+f.id+"','"+key+"',value)";

  }
  return '<label class="'+cls+'">'+esc(label)+mk+'<input type="text" value="'+esc(raw)+'" onchange="upd(\'freelancers\',\''+f.id+'\',\''+key+'\',this.value)"></label>';
}
/* campos de um evento */
function evFld(f,ev,key,label,type){
  var raw=(ev[key]===null||ev[key]===undefined?'':ev[key]);
  var call="updEv('"+f.id+"','"+ev.id+"','"+key+"',";
  if(type==='date') return '<label class="fl">'+esc(label)+dateTrio('',raw,call+"value)")+'</label>';
  if(type==='money'){
    if(sensHidden('freelancers','valor',f.id)) return sensBox(label);
    return '<label class="fl">'+esc(label)+moneyField(raw,call+"moneyUnmask(this.value))")+'</label>';
  }
  if(type==='qtd'){
    var q=evQtd(ev);
    return '<label class="fl">'+esc(label)+'<input type="number" min="1" step="1" value="'+q+'" onchange="'+call+'this.value)">'+
      '<span class="muted" style="font-size:11px;font-weight:500">'+(q>1?'👥 Ele + '+(q-1)+' pessoa'+(q>2?'s':'')+' da equipe dele':'Só ele (1 pessoa)')+'</span></label>';
  }
  if(type==='uf'){
    var o='<option value="">— selecione —</option>';
    UF_LIST.forEach(function(u){ o+='<option value="'+u[0]+'"'+(raw===u[0]?' selected':'')+'>'+u[0]+' — '+u[1]+'</option>'; });
    return '<label class="fl">'+esc(label)+'<select onchange="'+call+'this.value)">'+o+'</select></label>';
  }
  return '<label class="fl">'+esc(label)+'<input type="text" value="'+esc(raw)+'"'+(type?' list="'+type+'"':'')+' onchange="'+call+'this.value)"></label>';

function updEv(fid,evid,key,val){
  var f=find('freelancers',fid); if(!f) return;
  if(!canEditRec('freelancers',fid)){ permDenied('freelancers','editar'); return; }
  var ev=null; (f.eventos||[]).forEach(function(x){ if(x.id===evid) ev=x; }); if(!ev) return;
  if(key==='valor'){ var n=parseFloat(val); val=isNaN(n)?null:Math.round(n*100)/100; }
  if(key==='qtd_pessoas'){ var qn=parseInt(val,10); val=(isNaN(qn)||qn<1)?1:qn; }
  if(key==='equipe_obs') val=(''+(val||'')).trim();
  if(key==='evento'||key==='local'||key==='funcao') val=(''+(val||'')).trim();
  var old=ev[key]; ev[key]=val;
  logEdit('freelancers',{id:f.id,nome:(f.nome||'(sem nome)')+' — '+(evNome(ev)||'evento')},'ev_'+key,old,val);
  saveLocal(); persist('freelancers',f);
  if(document.getElementById('overlay').className.indexOf('show')>=0&&window._curFreel===fid) document.getElementById('modal').innerHTML=freelModal(f);
}
function addEv(fid){
  var f=find('freelancers',fid); if(!f) return;
  if(!canEditRec('freelancers',fid)){ permDenied('freelancers','editar'); return; }
  normFreel(f);
  var ev={id:uid()}, F=FREEL_FILTRO;
  if(F.valor){ if(F.modo==='uf') ev.estado=F.valor; else ev.evento=F.valor; }
  f.eventos.unshift(ev);
  logEdit('freelancers',{id:f.id,nome:f.nome||'(sem nome)'},'ev_novo','','novo evento');
  saveLocal(); persist('freelancers',f);
  FREEL_SUB='eventos'; document.getElementById('modal').innerHTML=freelModal(f);
}
function delEv(fid,evid){
  var f=find('freelancers',fid); if(!f) return;
  if(!canEditRec('freelancers',fid)){ permDenied('freelancers','editar'); return; }
  var ev=null; (f.eventos||[]).forEach(function(x){ if(x.id===evid) ev=x; }); if(!ev) return;
  if(!confirm('Remover o evento "'+(evNome(ev)||'sem nome')+'" do histórico de '+(f.nome||'este freelancer')+'?')) return;
  f.eventos=f.eventos.filter(function(x){ return x.id!==evid; });
  logEdit('freelancers',{id:f.id,nome:f.nome||'(sem nome)'},'ev_removido',evNome(ev)+(ev.periodo_inicio?' ('+fmtD(ev.periodo_inicio)+')':''),'removido');
  saveLocal(); persist('freelancers',f);
  document.getElementById('modal').innerHTML=freelModal(f);
}
function freelModal(f){
  window._curFreel=f.id;
  normFreel(f);
  var _miss=freelMissing(f);
  FREEL_MISS_MAP={}; _miss.forEach(function(m){ FREEL_MISS_MAP[m.key]=true; });
  var evs=f.eventos||[], ufsF={}; evs.forEach(function(ev){ if(ev.estado) ufsF[ev.estado]=1; });
  var totF=0; evs.forEach(function(ev){ totF+=evTotal(ev); });

/* ================= REDIMENSIONAR COLUNAS (arrastar borda do cabeçalho) ================= */
var COLW=(function(){ try{return JSON.parse(window.localStorage.getItem('dp_iled_colw')||'{}');}catch(e){return {};} })();
function saveColW(){ try{window.localStorage.setItem('dp_iled_colw',JSON.stringify(COLW));}catch(e){} }
function makeResizable(table){
  if(!table) return;
  var tid=table.getAttribute('data-colkey')||table.id; if(!tid) return;
  table.classList.add('tbl-resizable');
  var ths=table.querySelectorAll('thead th');
  var cols=table.querySelectorAll('colgroup col');
  ths.forEach(function(th,i){
    /* colunas sem texto no cabeçalho (ação de excluir, checkbox de seleção) não precisam de puxador */
    if(!th.textContent.trim()) return;
    var key=tid+'_c'+i;
    var savedW=COLW[key];
    if(savedW){
      if(cols[i]) cols[i].style.width=savedW+'px';
      th.style.width=savedW+'px';
    } else if(!cols[i]){
      /* sem colgroup: fixa a largura atual renderizada pra não "pular" ao virar table-layout:fixed */
      var w=th.getBoundingClientRect().width;
      if(w>0) th.style.width=Math.round(w)+'px';
    }
    if(th.querySelector('.col-resizer')) return;
    th.classList.add('resizable-th');
    var grip=document.createElement('span');
    grip.className='col-resizer';
    grip.addEventListener('click',function(e){ e.stopPropagation(); });
    grip.addEventListener('pointerdown',function(e){
      e.preventDefault(); e.stopPropagation();
      grip.setPointerCapture(e.pointerId);
      grip.classList.add('active');
      var startX=e.clientX, startW=th.getBoundingClientRect().width;
      function onMove(ev){
        var w=Math.max(44,Math.round(startW+(ev.clientX-startX)));
        if(cols[i]) cols[i].style.width=w+'px';
        th.style.width=w+'px';
      }
      function onUp(ev){
        grip.releasePointerCapture(e.pointerId);
        grip.removeEventListener('pointermove',onMove);
        grip.removeEventListener('pointerup',onUp);
        grip.classList.remove('active');
        var w=cols[i]?parseFloat(cols[i].style.width):th.getBoundingClientRect().width;
        if(w){ COLW[key]=Math.round(w); saveColW(); }
        if(table.getAttribute('data-colkey')) document.querySelectorAll('table[data-colkey="'+tid+'"]').forEach(function(t2){ if(t2!==table) makeResizable(t2); });
      }
      grip.addEventListener('pointermove',onMove);
      grip.addEventListener('pointerup',onUp);
    });
    th.appendChild(grip);
  });
}
function resetColW(tid){
  Object.keys(COLW).forEach(function(k){ if(k.indexOf(tid+'_c')===0) delete COLW[k]; });
  saveColW(); render();
}
/* tipos de coluna que são numéricos (comparação por valor) — os demais (texto/data ISO) comparam bem como string */
var SORT_NUM_TYPES={moeda:1,num:1,num2:1,int:1,autodays:1};
function sortRows(t){
  var st=SORT_STATE[t]; if(!st||!st.key) return;
  var cols=COLS[t]||[], col=null;
  for(var i=0;i<cols.length;i++){ if(cols[i][0]===st.key){ col=cols[i]; break; } }
  var numeric = col && SORT_NUM_TYPES[col[2]];
  STORE[t].sort(function(a,b){
    var av=a[st.key], bv=b[st.key];
    if(numeric){
      av=(av===''||av===null||av===undefined||isNaN(parseFloat(av)))?-Infinity:parseFloat(av);
      bv=(bv===''||bv===null||bv===undefined||isNaN(parseFloat(bv)))?-Infinity:parseFloat(bv);
      var d = av-bv;
      return st.dir*(d||0);
    }
    av=(''+(av===null||av===undefined?'':av)); bv=(''+(bv===null||bv===undefined?'':bv));
    return st.dir*av.localeCompare(bv,'pt-BR',{numeric:true,sensitivity:'base'});
  });
}
function toggleSort(t,key){
  var st=SORT_STATE[t];
  if(st && st.key===key){ st.dir=-st.dir; } else { SORT_STATE[t]={key:key,dir:1}; }
  render();
}
function sortArrow(t,key){
  var st=SORT_STATE[t];
  if(!st||st.key!==key) return '';
  return st.dir===1?' ▲':' ▼';
}

function refreshSubrow(id){

function refreshCell(t,id,key){
  var cols=COLS[t]||[], col=null;
  for(var i=0;i<cols.length;i++){ if(cols[i][0]===key){ col=cols[i]; break; } }

    return '<select '+on+dis+'>'+opts+'</select>';

  if(type==='motivo'){
    var mots=['PEDIDO DE DEMISSÃO','DISPENSA PELA EMPRESA','ACORDO','ACORDO PJ','TÉRMINO DE CONTRATO'];var opts='<option value="">—</option>';var f=false;
    mots.forEach(function(e){var s=(e===val)?' selected':'';if(s)f=true;opts+='<option'+s+'>'+e+'</option>';});
    if(val&&!f)opts+='<option selected>'+esc(val)+'</option>';
    return '<select '+on+dis+'>'+opts+'</select>';
  }
  if(type==='clt'){
    var ctopts=['CLT','PJ'];var oh='<option value="">—</option>';var fct=false;
    ctopts.forEach(function(e){var s=(e===val)?' selected':'';if(s)fct=true;oh+='<option'+s+'>'+e+'</option>';});
    if(val&&!fct)oh+='<option selected>'+esc(val)+'</option>';
    return '<select '+on+dis+'>'+oh+'</select>';
  }
  if(type==='calcTotal'){
    return '<span style="font-weight:700">'+money(rescTotal(r))+'</span>';
  }
  if(type==='recDetail'){
    var bits=[];
    if(isYes(r.multa_rescisoria)) bits.push('Multa: '+money(r.valor_multa_rescisoria||0)+(isYes(r.multa_paga)?' (paga ✔)':' (pendente)'));
    if(num(r.valor_fgts_mensal)) bits.push('FGTS mensal: '+money(r.valor_fgts_mensal));
    var pinfo=parcelasInfo(r);
    if(pinfo) bits.push((pinfo.quitado?'✅ ':'🧾 ')+pinfo.total+'x parcelado — detalhe na linha abaixo');
    var badge = bits.length ? '<div class="muted" style="font-size:10px;margin-top:3px">'+esc(bits.join(' · '))+'</div>' : '';
    return '<button class="btn ghost sm" onclick="openResc(\''+t+'\',\''+r.id+'\')">📋 Detalhes</button>'+badge;
  }
  if(type==='pastaCheck'){
    var pYes2=isYes(val);
    var pinfo2 = t==='rescisoes' ? parcelasInfo(r) : null;
    var pCls,pLbl;
    if(pinfo2){
      var mQuit=multaQuitada(r);
      if(pinfo2.quitado && mQuit){ pCls='c-ok'; pLbl='✅ Quitado'; }
      else {
        var ddi2=daysBetween(today(),(''+(pinfo2.proxima?pinfo2.proxima.vencimento:r.vencimento||'')).slice(0,10));
        pCls = (ddi2!==null && ddi2<0) ? 'c-crit' : 'c-warn';
        pLbl = pinfo2.quitado ? 'Multa pendente' : 'Em aberto ('+pinfo2.pagas+'/'+pinfo2.total+')';
      }
      return '<span class="chip '+pCls+'" title="Detalhe das parcelas e da multa na linha abaixo">'+pLbl+'</span>';
    }
    var ddp=daysBetween(today(),(''+(r.vencimento||'')).slice(0,10));
    if(pYes2){ pCls='c-ok'; pLbl='✔ Pago'; }
    else if(ddp===null){ pCls='c-mut'; pLbl='—'; }
    else if(ddp<0){ pCls='c-crit'; pLbl='Vencido '+(-ddp)+'d'; }
    else if(ddp===0){ pCls='c-warn'; pLbl='Vence hoje'; }
    else { pCls='c-ok'; pLbl='Vence em '+ddp+'d'; }
    return '<div class="flex" style="gap:6px;flex-wrap:nowrap"><span class="chip '+pCls+'">'+pLbl+'</span>'+
      '<select onchange="upd(\''+t+'\',\''+r.id+'\',\''+key+'\',this.value)"'+dis+'><option value="NÃO"'+(!pYes2?' selected':'')+'>NÃO</option><option value="SIM"'+(pYes2?' selected':'')+'>SIM</option></select></div>';
  }
  if(type==='check'){
    var yes=isYes(val);
    return '<select onchange="upd(\''+t+'\',\''+r.id+'\',\''+key+'\',this.value)"'+dis+'><option value="NÃO"'+(!yes?' selected':'')+'>NÃO</option><option value="SIM"'+(yes?' selected':'')+'>SIM</option></select>';
  }
  if(type==='checkVencido'){
    /* enquanto não estiver marcado SIM, mostra sempre como vencido (não depende de data) */
    var yes6=isYes(val);
    var cls6=yes6?'c-ok':'c-crit';
    var lbl6=yes6?'✔ Salvo':'Vencido';
    return '<div class="flex" style="gap:6px;flex-wrap:nowrap"><span class="chip '+cls6+'">'+lbl6+'</span>'+
      '<select onchange="upd(\''+t+'\',\''+r.id+'\',\''+key+'\',this.value)"'+dis+'><option value="NÃO"'+(!yes6?' selected':'')+'>NÃO</option><option value="SIM"'+(yes6?' selected':'')+'>SIM</option></select></div>';
  }
  if(type==='date'){
    var extra='';
    if(t==='rescisoes'&&key==='vencimento'&&parcelasInfo(r)){
      extra='<div class="muted" style="font-size:9px;margin-top:2px;white-space:nowrap">vencimento da multa · parcelas ↓</div>';
    }
    var codeDate="upd('"+t+"','"+r.id+"','"+key+"',value)";
    return dateTrio('',val,codeDate,!!locked)+extra;
  }
  if(type==='month'){ var mv=(''+val).slice(0,7); return '<input type="month" value="'+esc(mv)+'" onchange="upd(\''+t+'\',\''+r.id+'\',\''+key+'\',this.value?this.value+\'-01\':\'\')"'+dis+'>'; }
  if(type==='moeda'){
    if(locked) return moneyField(val,'',' disabled');
    var codeMoeda="upd('"+t+"','"+r.id+"','"+key+"',moneyUnmask(this.value))";
    return moneyField(val,codeMoeda);
  }
  if(type==='num'||type==='int') return '<input type="number" step="'+(type==='int'?'1':'0.01')+'" value="'+esc(val)+'" '+on+dis+'>';
  if(type==='autodays'){
    var d=daysBetween(r.inicio,r.fim); var calc=(d!==null&&d>=0)?(d+1):'';
    return '<input type="number" value="'+esc(val!==''?val:calc)+'" title="auto: '+(calc||'-')+'" '+on+dis+'> <span class="muted" style="font-size:10px">auto:'+(calc||'-')+'</span>';
  }
  if(type==='calcDate'){
    return val ? '<span style="font-weight:600">'+fmtD(val)+'</span> <span class="muted" style="font-size:10px">auto</span>' : '<span class="muted" style="font-size:11px">preencha início e dias</span>';
  }
  return '<input value="'+esc(val)+'" '+on+dis+'>';
}

function multaQuitada(r){ return !isYes(r.multa_rescisoria) || isYes(r.multa_paga); }
function toggleMultaPaga(id,val){
  var r=find('rescisoes',id); if(!r)return;
  r.multa_paga=val;
  saveLocal(); persist('rescisoes',r);
  if(document.getElementById('overlay').className.indexOf('show')>=0){ document.getElementById('modal').innerHTML=rescModal(r); }
  refreshCell('rescisoes',id,'detalhes');
  refreshCell('rescisoes',id,'pasta');
  refreshSubrow(id);
}
function parcelasInfo(r){
  if((''+(r.tipo_desligamento||'')).toUpperCase()!=='ACORDO PJ' || !isYes(r.parcelado_pj)) return null;
  var arr=parseParcelas(r.parcelas_pj);
  if(!arr.length) return null;
  var pagas=arr.filter(function(p){return isYes(p.pago);}).length;
  var proxima=null;
  for(var i=0;i<arr.length;i++){ if(!isYes(arr[i].pago)){ proxima={idx:i,valor:arr[i].valor,vencimento:arr[i].vencimento}; break; } }
  return {total:arr.length,pagas:pagas,quitado:pagas===arr.length,proxima:proxima};
}
function parseParcelas(s){
  if(!s) return [];
  if(typeof s==='object') return s;
  try{ var a=JSON.parse(s); return Array.isArray(a)?a:[]; }catch(e){ return []; }
}
function openResc(t,id){
  var r=find(t,id); if(!r)return;
  document.getElementById('modal').innerHTML=rescModal(r);
  document.getElementById('overlay').className='overlay show';
}
function updResc(id,key,val){
  var r=find('rescisoes',id); if(!r)return;
  var _oldVal=r[key];
  r[key]=val;
  logEdit('rescisoes',r,key,_oldVal,val);
  saveLocal(); persist('rescisoes',r);
  document.getElementById('modal').innerHTML=rescModal(r);
  refreshCell('rescisoes',id,'valor_total_calc');
  refreshCell('rescisoes',id,'detalhes');
  refreshCell('rescisoes',id,'pasta');
  if(key==='valor') refreshCell('rescisoes',id,'valor');
  refreshSubrow(id);
}
function dividirParcelasIgual(id){
  var r=find('rescisoes',id); if(!r)return;
  var total=num(r.valor);
  var arr=parseParcelas(r.parcelas_pj);
  if(!total||!arr.length)return;
  var n=arr.length;
  var base=Math.floor((total/n)*100)/100;
  var soma=0;
  arr.forEach(function(p,i){
    p.valor = (i<n-1) ? base : Math.round((total-soma)*100)/100;
    soma += p.valor;
  });
  r.parcelas_pj=JSON.stringify(arr);
  saveLocal(); persist('rescisoes',r);
  document.getElementById('modal').innerHTML=rescModal(r);
  refreshCell('rescisoes',id,'detalhes');
  refreshSubrow(id);
}
function setParcelaQtd(id,n){
  var r=find('rescisoes',id); if(!r)return;
  n=Math.max(0,parseInt(n)||0);
  var arr=parseParcelas(r.parcelas_pj);
  while(arr.length<n) arr.push({valor:'',vencimento:''});
  while(arr.length>n) arr.pop();
  r.parcelas_pj=JSON.stringify(arr);
  saveLocal(); persist('rescisoes',r);
  document.getElementById('modal').innerHTML=rescModal(r);
  refreshCell('rescisoes',id,'detalhes');
  refreshSubrow(id);
}
function updParcela(id,idx,key,val){
  var r=find('rescisoes',id); if(!r)return;
  var arr=parseParcelas(r.parcelas_pj);
  if(!arr[idx])arr[idx]={valor:'',vencimento:''};
  arr[idx][key]=key==='valor'?(val===''?'':parseFloat((''+val).replace(',','.'))):val;
  r.parcelas_pj=JSON.stringify(arr);
  saveLocal(); persist('rescisoes',r);
  document.getElementById('modal').innerHTML=rescModal(r);
  refreshCell('rescisoes',id,'detalhes');
  refreshCell('rescisoes',id,'pasta');
  refreshSubrow(id);
}

    } else {

function toggleCustosSelAll(checked){
  var trs=document.querySelectorAll('#tbl_custos tbody tr');
  for(var i=0;i<trs.length;i++){
    if(trs[i].style.display==='none') continue; // só afeta as linhas visíveis no filtro atual
    var id=trs[i].getAttribute('data-id');
    if(checked) CUSTOS_SEL[id]=true; else delete CUSTOS_SEL[id];
  }
  render(); filterCustos();
