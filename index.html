<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DP ILED — Departamento Pessoal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f7;--bg2:#fff;--panel:#fff;--panel2:#fbfbfc;--panelh:#f0f1f4;
  --line:rgba(15,17,25,.08);--line2:rgba(15,17,25,.14);
  --txt:#14151a;--mut:#6b7080;--mut2:#9a9fac;
  --red:#e10600;--red2:#c40500;--grn:#1a8f52;--amber:#b9760a;--blue:#2455c9;
  --shadow:0 10px 30px rgba(20,21,26,.08);
  --glass:rgba(255,255,255,.72);--glass-hi:rgba(255,255,255,.9);
  --glass-bd:rgba(15,17,25,.08);
  --glass-sh:0 8px 28px rgba(20,21,26,.07),inset 0 1px 0 rgba(255,255,255,.8);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--txt);font-size:14px;
  background:
    radial-gradient(1100px 500px at 85% -10%,rgba(225,6,0,.05),transparent 60%),
    radial-gradient(900px 480px at 0% 0%,rgba(36,85,201,.045),transparent 55%),
    var(--bg);
  min-height:100vh;
}
.subbar{height:4px;width:100%;display:flex;position:sticky;top:0;z-index:50}
.subbar span{flex:1}
.subbar span:nth-child(1){background:var(--red)}
.subbar span:nth-child(2){background:var(--amber)}
.subbar span:nth-child(3){background:#fff}
.subbar span:nth-child(4){background:var(--blue)}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;flex-wrap:wrap}
header img{height:44px;width:auto;border-radius:6px}
.htitle{font-weight:800;letter-spacing:-.4px;font-size:18px;line-height:1}
.hsub{color:var(--mut);font-size:12px;margin-top:3px}
.dbchip{margin-left:auto;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut2);display:inline-block}
.dot.on{background:var(--grn)}
.dot.off{background:var(--amber)}
nav.tabs{display:flex;gap:4px;padding:0 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.tabs button{
  background:none;border:none;padding:11px 16px;cursor:pointer;color:var(--mut);
  font-weight:600;font-size:13px;border-bottom:2px solid transparent;font-family:inherit;
}
nav.tabs button.active{color:var(--txt);border-bottom-color:var(--red)}
main{padding:20px 22px 60px;max-width:1500px;margin:0 auto}
.panel,.card{
  background:linear-gradient(180deg,var(--glass-hi) 0%,var(--glass) 100%);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--glass-bd);border-top:1px solid rgba(255,255,255,.95);
  border-radius:14px;box-shadow:var(--glass-sh);
}
.card{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi .eye{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.kpi .big{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:6px}
.kpi .desc{font-size:11.5px;color:var(--mut);margin-top:3px}
.kpi.hero{border-top:3px solid var(--red);background:linear-gradient(180deg,rgba(225,6,0,.04),var(--glass))}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select{
  font-family:inherit;font-size:13px;color:var(--txt);background:var(--bg2);
  border:1px solid var(--line2);border-radius:9px;padding:8px 10px;outline:none;
}
input:focus,select:focus{border-color:var(--red)}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut);font-weight:600}
.btn{
  border:none;border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;
  cursor:pointer;font-family:inherit;background:var(--red);color:#fff;box-shadow:var(--shadow);
}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.save{background:var(--mut2)}
.btn.save.draft{background:var(--amber)}
.btn.save.saved{background:var(--grn)}
.tablewrap{overflow:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{
  background:var(--panelh);color:var(--mut);text-transform:uppercase;font-size:10px;
  letter-spacing:.8px;padding:9px 10px;text-align:left;position:sticky;top:0;white-space:nowrap;
}
td{padding:7px 10px;border-bottom:1px solid var(--line)}
tr:nth-child(even) td{background:rgba(240,241,244,.5)}
tr:hover td{background:var(--panelh)}
td input,td select{border:1px solid transparent;background:transparent;padding:5px 6px;width:100%;min-width:70px;border-radius:6px}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{border-color:var(--red);background:#fff}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.c-ok{background:#e8f5ee;color:var(--grn)}
.c-warn{background:#fbf1e0;color:var(--amber)}
.c-crit{background:#fde8e7;color:var(--red2)}
.c-info{background:#e7edfb;color:var(--blue)}
.c-mut{background:#eef0f3;color:var(--mut)}
.section-title{font-weight:800;font-size:15px;margin:0 0 4px}
.section-sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.subtabs{display:flex;gap:6px;margin:6px 0 16px;flex-wrap:wrap}
.subtabs button{background:var(--panelh);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--mut);font-family:inherit}
.subtabs button.active{background:#fff;color:var(--txt);border-color:var(--red);box-shadow:var(--glass-sh)}
.overlay{position:fixed;inset:0;background:rgba(20,21,26,.42);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 14px;overflow:auto}
.overlay.show{display:flex}
.modal{width:100%;max-width:920px;padding:22px;margin:auto 0}
.modal h2{margin:0 0 2px;font-size:18px}
.xrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.close{cursor:pointer;font-size:22px;color:var(--mut);background:none;border:none}
.searchcard{cursor:pointer;transition:transform .1s}
.searchcard:hover{transform:translateY(-2px)}
.emp-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eef0f3;color:var(--mut)}
.venc-line{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.muted{color:var(--mut)}
canvas{max-width:100%}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.empgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.empcard .nm{font-weight:700;font-size:13.5px;margin-bottom:2px}
.empcard .fn{color:var(--mut);font-size:11.5px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>

function loadLocal(){
  try{
    var s = window.localStorage.getItem('dp_iled_v1');
    if(s){ STORE = JSON.parse(s); return true; }
  }catch(e){}
  return false;
}
function saveLocal(){
  try{ window.localStorage.setItem('dp_iled_v1', JSON.stringify(STORE)); }catch(e){}
}
function loadCfg(){
  try{ var c=window.localStorage.getItem('dp_iled_cfg'); if(c) CFG=JSON.parse(c);}catch(e){}
}
function uid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=(Math.random()*16)|0;
    return (c==='x'?r:((r&0x3)|0x8)).toString(16);
  });
}
function isUuid(v){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(''+v); }
function migrateIds(){
  var changed=false;
  for(var k in STORE){ if(!STORE[k])continue; for(var i=0;i<STORE[k].length;i++){ if(!STORE[k][i].id||!isUuid(STORE[k][i].id)){ STORE[k][i].id=uid(); changed=true; } } }
  if(changed) saveLocal();
}

/* seed ids */
function seedIds(arr){ for(var i=0;i<arr.length;i++){ if(!arr[i].id) arr[i].id=uid(); } return arr; }

var TBL = {colaboradores:'dp_colaboradores',rescisoes:'dp_rescisoes',ferias:'dp_ferias',folha:'dp_folha',custos:'dp_custos'};
function sbHeaders(){ return {'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'}; }
function sbConfigured(){ return CFG.url && CFG.key; }
function setDbStatus(on,txt){
  var d=document.getElementById('dbdot'), t=document.getElementById('dbtxt');
  d.className='dot '+(on?'on':'off'); t.textContent=txt;
}
function sbTest(cb){
  if(!sbConfigured()){ setDbStatus(false,'Modo local'); return; }
  fetch(CFG.url+'/rest/v1/'+TBL.colaboradores+'?select=id&limit=1',{headers:sbHeaders()})
    .then(function(r){ if(r.ok){ setDbStatus(true,'Supabase conectado'); if(cb)cb(true); } else { setDbStatus(false,'Erro Supabase'); if(cb)cb(false);} })
    .catch(function(){ setDbStatus(false,'Sem conexão'); if(cb)cb(false); });
}
function sbPull(){
  if(!sbConfigured()){ alert('Configure a URL e a chave do Supabase primeiro.'); return; }
  var keys=Object.keys(TBL), done=0, tmp={};
  keys.forEach(function(k){
    fetch(CFG.url+'/rest/v1/'+TBL[k]+'?select=*',{headers:sbHeaders()})
      .then(function(r){return r.json();})
      .then(function(rows){ tmp[k]=Array.isArray(rows)?rows:[]; done++; if(done===keys.length)finishPull(tmp); })
      .catch(function(){ tmp[k]=[]; done++; if(done===keys.length)finishPull(tmp); });
  });
}
function finishPull(tmp){
  var total=0; for(var k in tmp){ if(tmp[k])total+=tmp[k].length; }
  if(total===0){
    alert('O Supabase está VAZIO — nada foi carregado. Seus dados locais foram mantidos.\n\nSe você ainda não populou o banco, use "Enviar tudo p/ Supabase".');
    return;
  }
  STORE=tmp; saveLocal(); render();
  alert('Dados carregados do Supabase: '+total+' registros.');
}

function isISODate(v){ return /^\d{4}-\d{2}-\d{2}/.test(''+v); }
function cleanRow(t,src){
  var r={}; for(var k in src){ if(src.hasOwnProperty(k)) r[k]=src[k]; }
  var dc=DATECOLS[t]||[], nc=NUMCOLS[t]||[];
  for(var i=0;i<dc.length;i++){ var d=r[dc[i]]; if(d===''||d===undefined||!isISODate(d)) r[dc[i]]=null; else r[dc[i]]=(''+d).slice(0,10); }
  for(var j=0;j<nc.length;j++){ var n=r[nc[j]]; if(n===''||n===undefined||n===null||isNaN(parseFloat(n))) r[nc[j]]=null; else r[nc[j]]=parseFloat(n); }
  // string vazia -> null nos demais campos (evita conflito de tipo)
  for(var kk in r){ if(r[kk]==='') r[kk]=null; }
  return r;
}
function sbUpsert(table,row,cb){
  fetch(CFG.url+'/rest/v1/'+table+'?on_conflict=id',{
    method:'POST',
    headers:Object.assign({},sbHeaders(),{'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify(row)
  }).then(function(r){ if(r.ok){ if(cb)cb(true); } else { r.text().then(function(tx){ if(cb)cb(false,r.status+': '+tx); }); } })
    .catch(function(e){ if(cb)cb(false,'rede: '+e); });
}
function sbDelete(table,id,cb){
  fetch(CFG.url+'/rest/v1/'+table+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:sbHeaders()})
    .then(function(r){ if(cb)cb(r.ok);}).catch(function(){ if(cb)cb(false);});
}

/* ================= HELPERS ================= */
function money(v){ if(v===null||v===undefined||v==='')return ''; var n=parseFloat(v); if(isNaN(n))return ''; return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function fmtD(s){ if(!s)return ''; var p=(''+s).slice(0,10).split('-'); if(p.length!==3)return s; return p[2]+'/'+p[1]+'/'+p[0]; }
function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ if(!a||!b)return null; var d1=new Date(a),d2=new Date(b); return Math.round((d2-d1)/86400000); }
function addMonths(iso,m){ if(!iso)return ''; var d=new Date(iso); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); }

/* vencimento status: retorna {cls,label,dias} baseado numa data alvo */
function vencStatus(dateIso){
  if(!dateIso) return {cls:'c-mut',label:'—'};
  var dd = daysBetween(today(), (''+dateIso).slice(0,10));
  if(dd===null) return {cls:'c-mut',label:'—'};
  if(dd<0) return {cls:'c-crit',label:'Vencido '+(-dd)+'d'};
  if(dd<=30) return {cls:'c-warn',label:'Vence em '+dd+'d'};
  return {cls:'c-ok',label:'OK ('+dd+'d)'};
}

function esc(s){ if(s===null||s===undefined)return''; return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* --- Status de férias (cruza colaboradores x registros) --- */
function normname(s){ return (''+(s||'')).toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-zà-ú ]/gi,'').replace(/\s+/g,' ').trim(); }
function feriasStatus(){
  var regs=STORE.ferias, ativas=[], aguardando=[], vencidas=[];
  var tdy=today();
  // ativas: registro em gozo hoje
  regs.forEach(function(r){ var i=(''+(r.inicio||'')).slice(0,10), f=(''+(r.fim||'')).slice(0,10); if(i&&f&&i<=tdy&&tdy<=f) ativas.push(r); });
  // mapa nome -> registros de férias
  var byName={};
  regs.forEach(function(r){ var k=normname(r.colaborador); if(!k)return; (byName[k]=byName[k]||[]).push(r); });
  // colaboradores ativos
  STORE.colaboradores.forEach(function(c){
    if(c.ativo===false) return;
    var adm=(''+(c.admissao||'')).slice(0,10); if(!adm) return;
    var meses=Math.floor((daysBetween(adm,tdy)||0)/30.44);
    var recs=byName[normname(c.nome)]||[];
    var emGozoAgora=recs.some(function(r){ var i=(''+(r.inicio||'')).slice(0,10),f=(''+(r.fim||'')).slice(0,10); return i&&f&&i<=tdy&&tdy<=f; });
    var temFuturo=recs.some(function(r){ var i=(''+(r.inicio||'')).slice(0,10); return i&&i>=tdy; });
    // aguardando marcação: já adquiriu (>=12m), não está em gozo e não tem férias futuras marcadas
    if(meses>=12 && !emGozoAgora && !temFuturo){ aguardando.push({nome:c.nome,meses:meses,empresa:c.empresa}); }
    // vencidas: estourou prazo concessivo (>=24m) e nunca gozou / sem registro dentro do prazo
    if(meses>=24){
      var gozou=recs.some(function(r){ return (''+(r.fim||'')).slice(0,10) && (''+(r.fim||'')).slice(0,10) < tdy; });
      if(!gozou) vencidas.push({nome:c.nome,meses:meses,empresa:c.empresa});
    }
  });
  return {ativas:ativas,aguardando:aguardando,vencidas:vencidas,reg:regs.length};
}

function cellEditor(t,r,c){
  var key=c[0], type=c[2], val=r[key]===null||r[key]===undefined?'':r[key];
  var on='onchange="upd(\''+t+'\',\''+r.id+'\',\''+key+'\',this.value)"';
  if(type==='sel'){
    var emps=['ILED','ILED SP','NEW ILED','ILED SÃO PAULO','RED'];var opts='<option value="">—</option>';var f=false;
    emps.forEach(function(e){var s=(e===val)?' selected':'';if(s)f=true;opts+='<option'+s+'>'+e+'</option>';});
    if(val&&!f)opts+='<option selected>'+esc(val)+'</option>';
    return '<select '+on+'>'+opts+'</select>';
  }
  if(type==='doc'){
    var docs=['TRCT','FGTS MENSAL','FGTS RESCISÓRIO'];var opts='<option value="">—</option>';var f=false;
    docs.forEach(function(e){var s=(e===val)?' selected':'';if(s)f=true;opts+='<option'+s+'>'+e+'</option>';});
    if(val&&!f)opts+='<option selected>'+esc(val)+'</option>';
    return '<select '+on+'>'+opts+'</select>';
  }
  if(type==='check'){
    var yes=isYes(val);
    return '<select onchange="upd(\''+t+'\',\''+r.id+'\',\''+key+'\',this.value)"><option value="NÃO"'+(!yes?' selected':'')+'>NÃO</option><option value="SIM"'+(yes?' selected':'')+'>SIM</option></select>';
  }
  if(type==='date') return '<input type="date" value="'+esc((''+val).slice(0,10))+'" '+on+'>';
  if(type==='month'){ var mv=(''+val).slice(0,7); return '<input type="month" value="'+esc(mv)+'" onchange="upd(\''+t+'\',\''+r.id+'\',\''+key+'\',this.value?this.value+\'-01\':\'\')">'; }
  if(type==='num'||type==='int') return '<input type="number" step="'+(type==='int'?'1':'0.01')+'" value="'+esc(val)+'" '+on+'>';
  if(type==='autodays'){
    var d=daysBetween(r.inicio,r.fim); var calc=(d!==null&&d>=0)?(d+1):'';
    return '<input type="number" value="'+esc(val!==''?val:calc)+'" title="auto: '+(calc||'-')+'" '+on+'> <span class="muted" style="font-size:10px">auto:'+(calc||'-')+'</span>';
  }
  return '<input value="'+esc(val)+'" '+on+'>';
}

function find(t,id){ var a=STORE[t]; for(var i=0;i<a.length;i++){ if(a[i].id===id)return a[i]; } return null; }
function upd(t,id,key,val){
  var r=find(t,id); if(!r)return;
  // auto férias dias
  r[key]=val;
  if(t==='ferias'&&(key==='inicio'||key==='fim')){ var d=daysBetween(r.inicio,r.fim); if(d!==null&&d>=0)r.dias=d+1; }
  if(t==='folha'||t==='custos'){ if(key==='liquido'||key==='gratif'){ r.total=num(r.liquido)+num(r.gratif); } }
  saveLocal(); persist(t,r);
  // refresh modal/venc chips live for colaboradores
  if(t==='colaboradores'&&COLAB_SUB==='vencimentos'&&document.getElementById('overlay').className.indexOf('show')>=0){ document.getElementById('modal').innerHTML=colabModal(r); }
  if((t==='folha'||t==='custos'||t==='ferias')){ var tb=document.getElementById('tbl_'+t); if(tb){ /* light refresh totals via re-render on next paint */ } }
}
function persist(t,r){
  saveLocal();
  if(sbConfigured()){ var rc=cleanRow(t,r); rc.atualizado_em=new Date().toISOString(); sbUpsert(TBL[t],rc,function(ok,err){ setDbStatus(ok,ok?'Supabase ✓ salvo':'Falha ao salvar'); if(!ok&&err)console.warn('Supabase',err); }); }
}
function delRow(t,id){
  if(!confirm('Excluir este registro?'))return;
  STORE[t]=STORE[t].filter(function(x){return x.id!==id;});
  saveLocal();
  if(sbConfigured())sbDelete(TBL[t],id,function(){});
  closeOv(); render();
}

  h+='<button class="btn ghost" onclick="pushAll()">↑ Enviar tudo p/ Supabase</button></div>';
  h+='<div style="margin-top:10px"><button class="btn ghost sm" onclick="restaurarPlanilha()">♻ Restaurar dados da planilha (local)</button></div>';
  h+='<div class="muted" style="font-size:11.5px;margin-top:14px">Passos: 1) crie as tabelas com o arquivo <b>dp_schema.sql</b> no SQL Editor. 2) cole URL+chave aqui. 3) "Enviar tudo" popula o banco com o que está no sistema. Depois do go-live, nunca rode scripts com TRUNCATE.</div>';
  document.getElementById('cfgbox').innerHTML=h;
  document.getElementById('cfgov').className='overlay show';
}
function saveCfg(){ var u=(document.getElementById('cfgUrl').value||'').trim(); u=u.replace(/\/+$/,''); u=u.replace(/\/rest\/v1$/,''); u=u.replace(/\/+$/,''); CFG.url=u; CFG.key=(document.getElementById('cfgKey').value||'').trim(); try{window.localStorage.setItem('dp_iled_cfg',JSON.stringify(CFG));}catch(e){} sbTest(function(){}); closeCfg(); }
function pushAll(){
  if(!sbConfigured()){ alert('Preencha URL e chave.'); return; }
  var keys=Object.keys(TBL), total=0, done=0, okc=0, errs=[];
  keys.forEach(function(k){ total+=STORE[k].length; });
  if(total===0){ alert('Nada para enviar.'); return; }
  setDbStatus(true,'Enviando...');
  keys.forEach(function(k){
    STORE[k].forEach(function(r){
      var rc=cleanRow(k,r); rc.atualizado_em=new Date().toISOString();
      sbUpsert(TBL[k],rc,function(ok,err){
        done++; if(ok)okc++; else if(err&&errs.length<3)errs.push(TBL[k]+' → '+err);
        if(done>=total){
          if(okc===total){ setDbStatus(true,'Supabase ✓ '+okc+' enviados'); alert('✅ Enviado com sucesso: '+okc+' registros.'); }
          else { setDbStatus(false,'Falhou '+(total-okc)); alert('⚠ Enviados: '+okc+' de '+total+'.\n\nExemplos de erro:\n'+errs.join('\n\n')+'\n\nSe for erro 401/permission, rode as policies (RLS). Se for de coluna/data, me manda esse texto.'); }
          render();
        }
      });
    });
  });
}
function closeCfg(){ document.getElementById('cfgov').className='overlay'; }
function closeOv(){ document.getElementById('overlay').className='overlay'; if(TAB==='colaboradores')renderColabList(); if(TAB!=='colaboradores'&&TAB!=='dashboard')render(); }
function exportJSON(){
  var blob=new Blob([JSON.stringify(STORE,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dp_iled_backup.json'; a.click();
}

/* overlay click-out */
document.getElementById('overlay').addEventListener('click',function(e){ if(e.target.id==='overlay')closeOv(); });
document.getElementById('cfgov').addEventListener('click',function(e){ if(e.target.id==='cfgov')closeCfg(); });

/* ================= BOOT ================= */
initData();
render();
sbTest(function(){});
</script>
