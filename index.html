function toggleCustosOnlySel(){
  CUSTOS_ONLY_SEL=!CUSTOS_ONLY_SEL;
  render(); filterCustos();
}
function filterCustos(){
  var from=(document.getElementById('custosFrom')||{}).value||'';
  var to=(document.getElementById('custosTo')||{}).value||'';
  var q=((document.getElementById('custosBusca')||{}).value||'').toLowerCase();
  var trs=document.querySelectorAll('#tbl_custos tbody tr');
  for(var i=0;i<trs.length;i++){
    var id=trs[i].getAttribute('data-id');
    var r=find('custos',id); if(!r){ continue; }
    var show=true;
    var comp=(''+(r.competencia||'')).slice(0,7);
    if(from && (!comp||comp<from)) show=false;
    if(to && (!comp||comp>to)) show=false;
    if(q && trs[i].textContent.toLowerCase().indexOf(q)<0) show=false;
    if(CUSTOS_ONLY_SEL && !CUSTOS_SEL[id]) show=false;
    trs[i].style.display = show?'':'none';
  }
}
function limparCustosFiltro(){
  var f1=document.getElementById('custosFrom'); if(f1)f1.value='';
  var f2=document.getElementById('custosTo'); if(f2)f2.value='';
  var fb=document.getElementById('custosBusca'); if(fb)fb.value='';
  CUSTOS_ONLY_SEL=false;
  render();
}
function addRow(t){ if(!can(t,'criar')){ permDenied(t,'criar'); return; } var r={id:uid()}; SESSION_NEW[r.id]=true; COLS[t].forEach(function(c){r[c[0]]='';}); if(t==='rescisoes')r.tipo_doc='TRCT'; if(t==='folha')r.editando='SIM'; STORE[t].push(r); persist(t,r); render(); }

/* ================= CRUD CORE ================= */
function find(t,id){ var a=STORE[t]; for(var i=0;i<a.length;i++){ if(a[i].id===id)return a[i]; } return null; }
function upd(t,id,key,val){
  var r=find(t,id); if(!r)return;
  if(TBL[t]&&!canEditRec(t,id)){ permDenied(t,'editar'); return; }
  var _oldVal=r[key];
  // aviso de ano irreal em campos de data
  if((DATECOLS[t]||[]).indexOf(key)>=0 && val && !anoValido(val)){
    showWarn('⚠ ano da data parece incorreto: '+val);
  }
  // auto férias: fim = início + (dias-1), usando datas reais (respeita meses de 28/29/30/31 dias)
  r[key]=val;
  logEdit(t,r,key,_oldVal,val);
  if(t==='ferias'&&(key==='inicio'||key==='dias')){
    var nd=parseInt(r.dias,10);
    if(r.inicio && nd>0){ r.fim = addDays(r.inicio, nd-1); }
  }
  if(t==='ferias'&&key==='inicio'){ var vb=subBusinessDays(r.inicio,2); if(vb)r.vencimento=vb; }
  if(t==='rescisoes'&&key==='desligamento'){ var vr=addDays(r.desligamento,10); if(vr)r.vencimento=vr; }
  var _pixAuto=false;
  if(t==='freelancers'&&key==='pix'&&(_oldVal||'')!==(val||'')){ r.pix_msg_em=null; pixLimparResposta(id,{pix_conf_em:null}); _pixAuto=!!val&&pixAutoOn()&&!window._pixSkipAuto; }
  if(t==='ferias'&&key==='valor'){ var vn=parseFloat(val); if(!isNaN(vn))r.valor=Math.round(vn*100)/100; }
  if(t==='folha'||t==='custos'){ if(key==='liquido'||key==='gratif'){ r.total=num(r.liquido)+num(r.gratif); } }
  saveLocal(); persist(t,r);
  // refresh modal/venc chips live for colaboradores (todas as abas — onchange só dispara quando o campo perde o foco, então é seguro re-renderizar)
  if(t==='colaboradores'&&document.getElementById('overlay').className.indexOf('show')>=0){ document.getElementById('modal').innerHTML=colabModal(r); }
  if(t==='freelancers'&&window._curFreel===id&&document.getElementById('overlay').className.indexOf('show')>=0){ document.getElementById('modal').innerHTML=freelModal(r); }
  /* atualiza só as células calculadas — nunca a célula que está sendo digitada, senão o campo perde o foco e "pula" no meio da data */
  if(t==='ferias'&&(key==='inicio'||key==='dias')){ refreshCell('ferias',id,'fim'); }
  if(t==='ferias'&&key==='inicio'){ refreshCell('ferias',id,'vencimento'); }
  if(t==='rescisoes'&&key==='desligamento'){ refreshCell('rescisoes',id,'vencimento'); refreshCell('rescisoes',id,'pasta'); refreshSubrow(id); }
  if(t==='rescisoes'&&key==='tipo_desligamento'){ refreshCell('rescisoes',id,'detalhes'); refreshSubrow(id); }
  if(t==='rescisoes'&&key==='valor'){ refreshCell('rescisoes',id,'valor_total_calc'); }
  if(t==='rescisoes'&&key==='pasta'){ refreshCell('rescisoes',id,'pasta'); }
  if(_pixAuto) pixEnviar(id,true);
}
function persist(t,r){
  if(TBL[t]&&!canEditRec(t,r.id)) return;
  saveLocal();
  if(t==='colaboradores'){
    var missing=colabMissingRequired(r);
    if(missing.length>0){
      // não sincroniza com o Supabase (não "salva" de verdade) enquanto faltarem os dados obrigatórios do colaborador
      setDbStatus(false,'Faltam dados obrigatórios');
      showColabReqWarn(missing);
      return;
    }
  }
  if(t==='freelancers' && freelMissing(r).length>0){ setDbStatus(false,'Freelancer incompleto'); return; }
  if(sbConfigured()){ var rc=cleanRow(t,r); rc.atualizado_em=new Date().toISOString(); sbUpsert(TBL[t],rc,function(ok,err){ setDbStatus(ok,ok?'Supabase ✓ salvo':'Falha ao salvar'); if(!ok&&err){ console.warn('Supabase',err); showWarn('⚠ Falha ao salvar: '+(''+err).slice(0,180)); } }); }
}
function delRow(t,id){
  if(!canDelRec(t,id)){ permDenied(t,'excluir'); return; }
  if(!confirm('Excluir este registro?'))return;
  STORE[t]=STORE[t].filter(function(x){return x.id!==id;});
  saveLocal();
  if(sbConfigured())sbDelete(TBL[t],id,function(){});
  closeOv(); render();
}

/* ================= KPI / DASHBOARD ================= */
function kpi(eye,big,desc,hero){ return '<div class="card kpi'+(hero?' hero':'')+'"><div class="eye">'+eye+'</div><div class="big">'+big+'</div><div class="desc">'+esc(desc||'')+'</div></div>'; }
function sum(rows,key){ var s=0; rows.forEach(function(r){s+=num(r[key]);}); return s; }
/* valor total da rescisão = valor + multa rescisória (quando houver), pois a multa é valor devido ao colaborador */
function rescTotal(r){ var v=num(r.valor); if(isYes(r.multa_rescisoria)) v+=num(r.valor_multa_rescisoria); return v; }
function pendenciasRescisoes(){
  var tdy=today(), out=[];
  (STORE.rescisoes||[]).forEach(function(r){
    var pinfo=parcelasInfo(r);
    if(pinfo){
      if(!pinfo.quitado){
        var v=(''+(pinfo.proxima.vencimento||'')).slice(0,10);
        if(v && v>=tdy) out.push({nome:r.colaborador,empresa:r.empresa,valor:num(pinfo.proxima.valor),vencimento:v,obs:'Parcela '+(pinfo.proxima.idx+1)+'/'+pinfo.total});
      }
      if(isYes(r.multa_rescisoria) && num(r.valor_multa_rescisoria)>0 && !isYes(r.multa_paga)){
        var vm=(''+(r.vencimento||'')).slice(0,10);
        if(vm && vm>=tdy) out.push({nome:r.colaborador,empresa:r.empresa,valor:num(r.valor_multa_rescisoria),vencimento:vm,obs:'Multa rescisória'});
      }
    } else {
      var v2=(''+(r.vencimento||'')).slice(0,10);
      if(v2 && v2>=tdy && !isYes(r.pasta)) out.push({nome:r.colaborador,empresa:r.empresa,valor:rescTotal(r),vencimento:v2,obs:''});
    }
  });
  out.sort(function(a,b){ return a.vencimento<b.vencimento?-1:(a.vencimento>b.vencimento?1:0); });
  return out;
}
function vencimentosPanel(){
  var list=pendenciasRescisoes();

  if(!list.length){ h+='<div class="muted" style="font-size:11px;margin-top:4px">Nenhum vencimento pendente.</div>'; }
  else{
    h+='<div class="tablewrap" style="margin-top:6px;max-height:160px;overflow:auto"><table style="font-size:11.5px"><tbody>';
    list.forEach(function(x){
      var dd=daysBetween(today(),x.vencimento);

      h+='<tr><td>'+esc(x.nome||'—')+(x.obs?' <span class="muted" style="font-size:10px">('+esc(x.obs)+')</span>':'')+'</td><td class="muted">'+esc(x.empresa||'')+'</td><td>'+money(x.valor)+'</td>'+
         '<td style="white-space:nowrap"><span class="chip '+cls+'" style="font-size:10.5px;padding:2px 7px">'+fmtD(x.vencimento)+' ('+dd+'d)</span></td></tr>';
    });
    h+='</tbody></table></div>';
  }
  return h+'</div>';
}
function isYes(v){ v=(''+(v||'')).toLowerCase(); return v==='sim'||v==='ok'||v==='true'||v==='1'||v==='x'; }
function mesNome(m){ return ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m]; }

var DASH_FROM='', DASH_TO='', DASH_EMP='';
function viewDashboard(){
  if(!DASH_FROM){ var d=new Date(); DASH_TO=d.toISOString().slice(0,10); d.setFullYear(d.getFullYear()-1); DASH_FROM=d.toISOString().slice(0,10); }
  var h='';
  h+='<div class="toolbar">';

  h+='<label class="fl">Até'+dateTrio('dto',DASH_TO,"DASH_TO=value;render()")+'</label>';
  h+='<label class="fl">Empresa<select id="demp" onchange="DASH_EMP=this.value;render()">'+dashEmpOptions()+'</select></label>';
  h+='<button class="btn ghost sm" onclick="pullBtn()">↻ Atualizar dados</button>';
  var etxt = DASH_EMP?(' · '+DASH_EMP):' · Todas as empresas';
  h+='<span class="right muted" style="font-size:12px">'+fmtD(DASH_FROM)+' a '+fmtD(DASH_TO)+etxt+'</span>';
  h+='</div>';

  var colabAtivos = DASH_EMP ? STORE.colaboradores.filter(function(c){return c.empresa===DASH_EMP;}).length : STORE.colaboradores.length;

  h+='<div class="kpis">';
  h+=kpi('Custo total folha',money(sum(folha,'total')),'no período',true);
  h+=kpi('Custos adicionais',money(sum(custos,'valor')),'no período');
  h+=kpi('Férias (valor)',money(sum(fer,'valor')),fer.length+' lançamentos');
  h+=kpi('Rescisões (valor, c/ multa)',money(resc.reduce(function(s,r){return s+rescTotal(r);},0)),resc.length+' no período');
  h+=kpi('Colaboradores ativos',colabAtivos,DASH_EMP||'total cadastrado');
  h+='</div>';

  h+='<div class="grid2">';
  h+='<div class="card"><div class="section-title">Evolução da folha (líquido + gratificação)</div><canvas id="chFolha" height="150"></canvas></div>';
  h+='<div class="card"><div class="section-title">Custos adicionais por mês</div><canvas id="chCustos" height="150"></canvas></div>';
  h+='</div>';
  h+='<div class="grid2" style="margin-top:18px">';
  h+='<div class="card"><div class="section-title">Folha por empresa (período)</div><canvas id="chEmp" height="150"></canvas></div>';
  h+='<div class="card"><div class="section-title">Férias vs Rescisões (valor por mês)</div><canvas id="chFerResc" height="150"></canvas></div>';
  h+='</div>';

function inRange(rows,key){
  return rows.filter(function(r){
    if(DASH_EMP && r.empresa!==DASH_EMP) return false;
    var d=(''+(r[key]||'')).slice(0,10); if(!d)return false;
    return d>=DASH_FROM && d<=DASH_TO;
  });
}
function dashEmpOptions(){
  var set={};
  ['folha','custos','ferias','rescisoes','colaboradores'].forEach(function(t){
    (STORE[t]||[]).forEach(function(r){ if(r.empresa)set[(''+r.empresa).trim()]=1; });
  });
  var keys=Object.keys(set).sort();
  var h='<option value=""'+(DASH_EMP===''?' selected':'')+'>Todas as empresas</option>';
  keys.forEach(function(e){ h+='<option'+(DASH_EMP===e?' selected':'')+'>'+esc(e)+'</option>'; });
  return h;
}
function monthKey(iso){ return (''+iso).slice(0,7); }
function pullBtn(){ if(sbConfigured()){ setDbStatus(true,'Atualizando...'); sbPullSilent(function(ok){ setDbStatus(ok,ok?'Supabase ✓ atualizado':'Falha'); render(); }); } else { render(); } }

var _charts=[];
function drawCharts(){
  _charts.forEach(function(c){try{c.destroy();}catch(e){}}); _charts=[];
  var folha=inRange(STORE.folha,'competencia').slice().sort(byMonth('competencia'));
  var custos=inRange(STORE.custos,'competencia').slice().sort(byMonth('competencia'));
  var grid={color:'rgba(255,255,255,.07)'}, tick={color:'#9aa0af'};
  var baseOpts={responsive:true,plugins:{legend:{labels:{color:'#c7ccd6'}}},scales:{x:{grid:grid,ticks:tick},y:{grid:grid,ticks:tick}}};

  // folha
  mk('chFolha',{type:'line',data:{labels:folha.map(function(r){return monthKey(r.competencia);}),
    datasets:[{label:'Líquido',data:folha.map(function(r){return num(r.liquido);}),borderColor:'#e10600',backgroundColor:'rgba(225,6,0,.08)',tension:.3,fill:true},
      {label:'Gratificação',data:folha.map(function(r){return num(r.gratif);}),borderColor:'#2455c9',tension:.3}]},options:baseOpts});
  // custos
  mk('chCustos',{type:'bar',data:{labels:custos.map(function(r){return monthKey(r.competencia);}),
    datasets:[{label:'Custos',data:custos.map(function(r){return num(r.valor);}),backgroundColor:'#b9760a'}]},options:baseOpts});
  // por empresa
  var byE={}; inRange(STORE.folha,'competencia').forEach(function(r){ byE[r.empresa||'—']=(byE[r.empresa||'—']||0)+num(r.total); });
  mk('chEmp',{type:'bar',data:{labels:Object.keys(byE),datasets:[{label:'Total folha',data:Object.keys(byE).map(function(k){return byE[k];}),backgroundColor:['#e10600','#2455c9','#1a8f52','#b9760a','#9a9fac']}]},options:Object.assign({indexAxis:'y'},baseOpts)});
  // fer vs resc
  var months={};
  inRange(STORE.ferias,'inicio').forEach(function(r){var m=monthKey(r.inicio);months[m]=months[m]||{f:0,r:0};months[m].f+=num(r.valor);});
  inRange(STORE.rescisoes,'desligamento').forEach(function(r){var m=monthKey(r.desligamento);months[m]=months[m]||{f:0,r:0};months[m].r+=rescTotal(r);});
  var mk2=Object.keys(months).sort();
  mk('chFerResc',{type:'line',data:{labels:mk2,datasets:[
    {label:'Férias',data:mk2.map(function(m){return months[m].f;}),borderColor:'#1a8f52',tension:.3},
    {label:'Rescisões',data:mk2.map(function(m){return months[m].r;}),borderColor:'#e10600',tension:.3}]},options:baseOpts});
}
function byMonth(k){ return function(a,b){ return (''+a[k]).slice(0,10)<(''+b[k]).slice(0,10)?-1:1; }; }
function mk(id,cfg){ var el=document.getElementById(id); if(!el||!window.Chart)return; _charts.push(new Chart(el.getContext('2d'),cfg)); }

function labelForLog(t,r){
  if(t==='colaboradores'||t==='freelancers') return r.nome||'(sem nome)';
  if(r.colaborador) return r.colaborador;
  if(r.empresa) return r.empresa+(r.competencia?(' — '+(''+r.competencia).slice(0,7)):'');
  return '(registro)';
}
function fmtDateTime(iso){
  if(!iso) return '';
  var d=new Date(iso); if(isNaN(d.getTime())) return ''+iso;
  return fmtD(iso)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function logEdit(t,r,key,oldVal,newVal){
  var ov=(oldVal===null||oldVal===undefined)?'':(''+oldVal);
  var nv=(newVal===null||newVal===undefined)?'':(''+newVal);
  if(ov===nv) return;
  var entry={id:uid(),tabela:t,registro_id:r.id,colaborador:labelForLog(t,r),campo:key,
    valor_antigo:ov.slice(0,300),valor_novo:nv.slice(0,300),usuario:getUserName(),quando:new Date().toISOString()};
  STORE.logs=STORE.logs||[];
  STORE.logs.unshift(entry);
  if(STORE.logs.length>800) STORE.logs=STORE.logs.slice(0,800);
  saveLocal();
  pushLog(entry);
  if(TAB==='historico') renderHistorico();
}
function pushLog(entry){
  if(!sbConfigured())return;
  fetch(CFG.url+'/rest/v1/'+TBL_LOGS,{method:'POST',headers:Object.assign({},sbHeaders(),{'Prefer':'return=minimal'}),body:JSON.stringify(entry)})
    .catch(function(){});
}
function pullLogsFromServer(cb){
  if(!sbConfigured()){ if(cb)cb([]); return; }
  fetch(CFG.url+'/rest/v1/'+TBL_LOGS+'?select=*&order=quando.desc&limit=500',{headers:sbHeaders()})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(rows){ if(cb)cb(Array.isArray(rows)?rows:[]); })
    .catch(function(){ if(cb)cb([]); });
}
function mergeLogs(rows){
  var byId={};
  (STORE.logs||[]).forEach(function(e){ byId[e.id]=e; });
  rows.forEach(function(e){ byId[e.id]=e; });

/* ================= PARTÍCULAS (dark, vermelhas grandes, nítidas) ================= */
(function(){
  var cv=document.getElementById('bg'); if(!cv)return; var cx=cv.getContext('2d');
  var W,H,parts=[],DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){ W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; cx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',resize); resize();
  var N=Math.max(24,Math.min(42,Math.round(W/38)));
  function rnd(a,b){ return a+Math.random()*(b-a); }
  for(var i=0;i<N;i++){
    var big=Math.random()<.30;
    parts.push({
      x:Math.random()*W, y:Math.random()*H,
      r: big?rnd(5,9):rnd(2,4.5),           // núcleo
      halo: big?rnd(22,40):rnd(10,20),      // brilho ao redor
      vx:rnd(-.28,.28), vy:rnd(-.28,.28),
      base: big?rnd(.5,.85):rnd(.35,.6),    // brilho base
      tw: rnd(.4,1.2), ph:Math.random()*Math.PI*2, // cintilar
      hot: Math.random()<.5                 // tom mais claro (vermelho-rosa) x vermelho puro
    });
  }
  var t=0;
  function loop(){
    t+=0.016;
    cx.clearRect(0,0,W,H);
    cx.globalCompositeOperation='lighter';   // brilhos somam = mais vivo
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<-40)p.x=W+40; if(p.x>W+40)p.x=-40;
      if(p.y<-40)p.y=H+40; if(p.y>H+40)p.y=-40;
      var k=p.base*(0.7+0.3*Math.sin(t*p.tw+p.ph));   // cintilar suave
      var cr=p.hot?'255,70,90':'225,10,10';
      var mid=p.hot?'255,31,68':'225,6,0';
      // halo (gradiente radial = definição real, sem borrão chapado)
      var g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.halo);
      g.addColorStop(0,'rgba('+mid+','+(k*0.55)+')');
      g.addColorStop(0.4,'rgba('+mid+','+(k*0.18)+')');
      g.addColorStop(1,'rgba('+mid+',0)');
      cx.fillStyle=g;
      cx.beginPath(); cx.arc(p.x,p.y,p.halo,0,Math.PI*2); cx.fill();
      // núcleo nítido e brilhante
      var g2=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g2.addColorStop(0,'rgba(255,235,235,'+Math.min(1,k+0.35)+')');
      g2.addColorStop(0.5,'rgba('+cr+','+Math.min(1,k+0.15)+')');
      g2.addColorStop(1,'rgba('+mid+',0)');
      cx.fillStyle=g2;
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2); cx.fill();
    }
    cx.globalCompositeOperation='source-over';
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ---------- SHA-256 (o PIN nunca vai em texto puro para o banco) ---------- */
function sha256(str){
  str=unescape(encodeURIComponent(str));
  function rotr(x,n){ return (x>>>n)|(x<<(32-n)); }
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var w=[], l=str.length*8, i;
  for(i=0;i<str.length;i++) w[i>>2]|=(str.charCodeAt(i)&255)<<(24-(i%4)*8);
  w[l>>5]|=0x80<<(24-l%32);
  w[(((l+64)>>9)<<4)+15]=l;
  for(var j=0;j<w.length;j+=16){
    var W=[],a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],hh=H[7];
    for(var t=0;t<64;t++){
      if(t<16) W[t]=w[j+t]|0;
      else { var x=W[t-15],y=W[t-2]; W[t]=(W[t-16]+(rotr(x,7)^rotr(x,18)^(x>>>3))+W[t-7]+(rotr(y,17)^rotr(y,19)^(y>>>10)))|0; }
      var t1=(hh+(rotr(e,6)^rotr(e,11)^rotr(e,25))+((e&f)^(~e&g))+K[t]+W[t])|0;
      var t2=((rotr(a,2)^rotr(a,13)^rotr(a,22))+((a&b)^(a&c)^(b&c)))|0;
      hh=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+hh)|0;
  }
  return H.map(function(v){ var s=(v>>>0).toString(16); while(s.length<8)s='0'+s; return s; }).join('');
}
function pinHash(salt,pin){ return sha256('iled-dp|'+salt+'|'+pin); }
function pinValido(p){ return /^\d{6}$/.test(''+p); }

/* ---------- regras de permissão ---------- */
function isMaster(){ return !!(CUR_USER&&CUR_USER.master); }
function can(tab,act){
  if(!CUR_USER) return false;
  if(isMaster()) return true;
  if(tab==='usuarios') return false;
  var p=(CUR_USER.permissoes||{})[tab];
  return !!(p&&p[act]);
}
function canSens(){ return isMaster()||!!(CUR_USER&&CUR_USER.sensiveis); }
/* quem tem "Criar" pode preencher o registro que acabou de criar nesta sessão */
function canEditRec(t,id){ return can(t,'editar')||(can(t,'criar')&&!!SESSION_NEW[id]); }
function canDelRec(t,id){ return can(t,'excluir')||!!SESSION_NEW[id]; }
function isSensKey(t,k){ return (SENS_KEYS[t]||[]).indexOf(k)>=0; }
function sensHidden(t,k,id){ return !canSens()&&isSensKey(t,k)&&!SESSION_NEW[id]; }
function sensBox(label){ return '<label class="fl">'+esc(label)+'<div class="sens-box">🔒 Dado restrito</div></label>'; }
function tabLabel(id){ for(var i=0;i<PERM_TABS.length;i++){ if(PERM_TABS[i].id===id) return PERM_TABS[i].label; } return id==='usuarios'?'🔐 Usuários':id; }
function actLabel(a){ for(var i=0;i<PERM_ACTS.length;i++){ if(PERM_ACTS[i][0]===a) return PERM_ACTS[i][1]; } return a; }
function permDenied(t,act){ showColabReqWarn([{label:'sem permissão para '+actLabel(act).replace(/^\S+\s/,'').toLowerCase()+' em '+tabLabel(t).replace(/^\S+\s/,'')}]); }
function firstAllowedTab(){
  for(var i=0;i<TABS.length;i++){ var id=TABS[i].id; if(id==='usuarios'?isMaster():can(id,'ver')) return id; }
  return '';
}

/* ---------- Supabase: usuários e acessos ---------- */
function sbPatch(table,id,obj,cb){
  fetch(CFG.url+'/rest/v1/'+table+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:Object.assign({},sbHeaders(),{'Prefer':'return=minimal'}),body:JSON.stringify(obj)})
    .then(function(r){ if(cb)cb(r.ok); }).catch(function(){ if(cb)cb(false); });
}
function sbGetUsers(cb){
  fetch(CFG.url+'/rest/v1/'+TBL_USERS+'?select=*&order=nome.asc',{headers:sbHeaders()})
    .then(function(r){ if(r.ok) return r.json().then(function(rows){ cb(true,Array.isArray(rows)?rows:[]); }); return r.text().then(function(tx){ cb(false,r.status+': '+tx); }); })
    .catch(function(e){ cb(false,'rede: '+e); });
}
function sbGetUser(id,cb){
  fetch(CFG.url+'/rest/v1/'+TBL_USERS+'?select=*&id=eq.'+encodeURIComponent(id),{headers:sbHeaders()})
    .then(function(r){ return r.ok?r.json():[]; }).then(function(rows){ cb(rows&&rows[0]?rows[0]:null); })
    .catch(function(){ cb(null); });
}
function logAcesso(evento,detalhe,user){
  user=user||CUR_USER;
  var entry={id:uid(),usuario:user?user.nome:'—',usuario_id:user?user.id:null,evento:evento,detalhe:detalhe||'',quando:new Date().toISOString()};
  ACESSOS.unshift(entry);
  if(!sbConfigured()) return;
  try{
    fetch(CFG.url+'/rest/v1/'+TBL_ACESSOS,{method:'POST',keepalive:true,headers:Object.assign({},sbHeaders(),{'Prefer':'return=minimal'}),body:JSON.stringify(entry)}).catch(function(){});
  }catch(e){}
}
function pullAcessos(cb){
  fetch(CFG.url+'/rest/v1/'+TBL_ACESSOS+'?select=*&order=quando.desc&limit=500',{headers:sbHeaders()})
    .then(function(r){ return r.ok?r.json():[]; }).then(function(rows){ ACESSOS=Array.isArray(rows)?rows:[]; if(cb)cb(); })
    .catch(function(){ if(cb)cb(); });
}

/* ---------- TELA DE ENTRADA (lock screen) ---------- */
function lockShow(html){
  var ov=document.getElementById('lockov'); document.getElementById('lockbox').innerHTML=html; ov.className='lock show';
  setTimeout(function(){ var f=document.querySelector('#lockbox [data-focus]'); if(f) f.focus(); },30);
}
function lockHead(sub){
  return '<div class="lock-logo">🔐</div><div class="lock-title">Departamento Pessoal</div><div class="lock-sub">'+sub+'</div>';
}
function lockMsg(txt,cls){ var el=document.getElementById('lockMsg'); if(el){ el.className='lock-msg '+(cls||'err'); el.innerHTML=txt; } }
function authBoot(){
  lockShow(lockHead('Carregando usuários...')+'<div class="lock-spin"></div>');
  if(!sbConfigured()){ lockShow(lockHead('Banco de dados não configurado.')+'<div class="lock-msg err">Configure o Supabase para usar o login.</div>'); return; }
  sbGetUsers(function(ok,data){
    if(!ok){
      lockShow(lockHead('Não foi possível carregar os usuários')+
        '<div class="lock-msg err">'+esc((''+data).slice(0,220))+'</div>'+
        '<div class="lock-hint">Se for o primeiro uso, confira se as tabelas <b>dp_usuarios</b> e <b>dp_acessos</b> foram criadas no Supabase (SQL Editor).</div>'+
        '<button class="btn" style="width:100%;margin-top:12px" onclick="authBoot()">↻ Tentar novamente</button>');
      return;
    }
    USERS=data;
    if(!USERS.length) lockSetup(); else lockLogin();
  });
}
function lockSetup(){
  lockShow(lockHead('Primeiro acesso — crie a conta da administradora master')+
    '<label class="fl">Seu nome<input id="lkNome" value="Mirthes" data-focus></label>'+
    '<label class="fl">Crie seu PIN (6 dígitos)<input id="lkPin" type="password" inputmode="numeric" maxlength="6" class="pin-in" placeholder="••••••"></label>'+
    '<label class="fl">Repita o PIN<input id="lkPin2" type="password" inputmode="numeric" maxlength="6" class="pin-in" placeholder="••••••" onkeydown="if(event.key===\'Enter\')criarMaster()"></label>'+
    '<div id="lockMsg" class="lock-msg"></div>'+
    '<button class="btn" style="width:100%;margin-top:6px" onclick="criarMaster()">👑 Criar administradora master</button>'+
    '<div class="lock-hint">A master tem acesso total e é a única que cadastra usuários e define permissões.</div>');
}
function criarMaster(){
  var nome=(document.getElementById('lkNome').value||'').trim(), p1=document.getElementById('lkPin').value, p2=document.getElementById('lkPin2').value;
  if(!nome) return lockMsg('Informe seu nome.');
  if(!pinValido(p1)) return lockMsg('O PIN precisa ter exatamente 6 números.');
  if(p1!==p2) return lockMsg('Os PINs não conferem.');
  var salt=uid();
  var u={id:uid(),nome:nome,master:true,ativo:true,bloqueado:false,tentativas:0,sensiveis:true,permissoes:{},salt:salt,pin_hash:pinHash(salt,p1),criado_em:new Date().toISOString(),atualizado_em:new Date().toISOString()};
  lockMsg('Criando...','info');
  sbUpsert(TBL_USERS,u,function(ok,err){
    if(!ok) return lockMsg('Falha ao salvar: '+esc((''+err).slice(0,180)));
    USERS=[u]; logAcesso('usuario_criado','administradora master',u); loginOk(u);
  });
}
function lockLogin(){
  var ativos=USERS.filter(function(u){ return u.ativo!==false; });
  var o='<option value="">— selecione seu nome —</option>';
  ativos.forEach(function(u){ o+='<option value="'+u.id+'">'+esc(u.nome)+(u.master?' 👑':'')+(u.bloqueado&&!u.master?' 🔒':'')+'</option>'; });
  lockShow(lockHead('Identifique-se para entrar')+
    '<label class="fl">Usuário<select id="lkUser" data-focus onchange="lkUserChange()">'+o+'</select></label>'+
    '<div id="lkPinWrap"><label class="fl">PIN (6 dígitos)<input id="lkPin" type="password" inputmode="numeric" maxlength="6" class="pin-in" placeholder="••••••" onkeydown="if(event.key===\'Enter\')doLogin()"></label></div>'+
    '<div id="lockMsg" class="lock-msg"></div>'+
    '<button class="btn" id="lkBtn" style="width:100%;margin-top:6px" onclick="doLogin()">🔓 Entrar</button>'+
    '<div class="lock-hint">Esqueceu o PIN ou foi bloqueado? Procure a administradora.</div>');
}
function lkUserChange(){
  var id=document.getElementById('lkUser').value, u=null;
  USERS.forEach(function(x){ if(x.id===id)u=x; });
  var w=document.getElementById('lkPinWrap');
  lockMsg('','');
  if(u&&!u.pin_hash){
    w.innerHTML='<div class="lock-msg info">Primeiro acesso de <b>'+esc(u.nome)+'</b>: crie seu PIN pessoal.</div>'+
      '<label class="fl">Crie seu PIN (6 dígitos)<input id="lkPin" type="password" inputmode="numeric" maxlength="6" class="pin-in" placeholder="••••••"></label>'+
      '<label class="fl">Repita o PIN<input id="lkPin2" type="password" inputmode="numeric" maxlength="6" class="pin-in" placeholder="••••••" onkeydown="if(event.key===\'Enter\')doLogin()"></label>';
  } else {
    w.innerHTML='<label class="fl">PIN (6 dígitos)<input id="lkPin" type="password" inputmode="numeric" maxlength="6" class="pin-in" placeholder="••••••" onkeydown="if(event.key===\'Enter\')doLogin()"></label>';
  }
  var p=document.getElementById('lkPin'); if(p) p.focus();
}
function doLogin(){
  var id=document.getElementById('lkUser').value, pin=(document.getElementById('lkPin')||{}).value||'';
  if(!id) return lockMsg('Selecione seu nome.');
  var btn=document.getElementById('lkBtn'); if(btn) btn.disabled=true;
  lockMsg('Verificando...','info');
  // busca o usuário atualizado no banco (bloqueio/tentativas sempre em dia)
  sbGetUser(id,function(u){
    if(btn) btn.disabled=false;
    if(!u) return lockMsg('Usuário não encontrado ou sem conexão com o banco.');
    if(u.ativo===false) return lockMsg('Este usuário está desativado. Procure a administradora.');
    if(u.bloqueado&&!u.master) return lockMsg('🔒 Usuário <b>bloqueado</b> após 5 PINs errados.<br>Procure a administradora para desbloquear.');
    if(u.master&&u.bloqueio_ate&&new Date(u.bloqueio_ate)>new Date()){
      var mins=Math.ceil((new Date(u.bloqueio_ate)-new Date())/60000);
      return lockMsg('⏳ Muitas tentativas erradas. Aguarde '+mins+' min para tentar de novo.');
    }
    // primeiro acesso: cria o PIN
    if(!u.pin_hash){
      var p2=(document.getElementById('lkPin2')||{}).value||'';
      if(!pinValido(pin)) return lockMsg('O PIN precisa ter exatamente 6 números.');
      if(pin!==p2) return lockMsg('Os PINs não conferem.');
      var salt=uid(), hsh=pinHash(salt,pin);
      sbPatch(TBL_USERS,u.id,{salt:salt,pin_hash:hsh,tentativas:0,atualizado_em:new Date().toISOString()},function(ok){
        if(!ok) return lockMsg('Falha ao salvar o PIN. Tente novamente.');
        u.salt=salt; u.pin_hash=hsh; logAcesso('pin_criado','primeiro acesso',u); loginOk(u);
      });
      return;
    }
    if(!pinValido(pin)) return lockMsg('Digite os 6 números do seu PIN.');
    if(pinHash(u.salt,pin)===u.pin_hash){ loginOk(u); return; }
    // PIN errado
    var tent=(parseInt(u.tentativas,10)||0)+1, patch={tentativas:tent};
    logAcesso('pin_errado','tentativa '+tent+' de 5',u);
    if(tent>=5){
      if(u.master){ patch.tentativas=0; patch.bloqueio_ate=new Date(Date.now()+5*60000).toISOString(); logAcesso('espera','master aguarda 5 min',u); }
      else { patch.bloqueado=true; logAcesso('bloqueio','5 PINs errados',u); }
    }
    sbPatch(TBL_USERS,u.id,patch,function(){});
    document.getElementById('lkPin').value='';
    if(tent>=5){
      if(u.master) lockMsg('⏳ 5 PINs errados. Por segurança, aguarde 5 minutos.');
      else { lockMsg('🔒 5 PINs errados — usuário <b>bloqueado</b>.<br>Só a administradora pode desbloquear.'); USERS.forEach(function(x){ if(x.id===u.id)x.bloqueado=true; }); }
    } else lockMsg('PIN incorreto. Restam <b>'+(5-tent)+'</b> tentativa'+(5-tent>1?'s':'')+' antes do bloqueio.');
  });
}
function loginOk(u){
  CUR_USER=u; if(!CUR_USER.permissoes||typeof CUR_USER.permissoes!=='object') CUR_USER.permissoes={};
  sbPatch(TBL_USERS,u.id,{tentativas:0,bloqueio_ate:null,ultimo_acesso:new Date().toISOString()},function(){});
  logAcesso('entrada','');
  document.getElementById('lockov').className='lock';
  renderUserChip();
  if(!(TAB==='usuarios'?isMaster():can(TAB,'ver'))) TAB=firstAllowedTab()||'dashboard';
  bootData();
}
function logout(){
  if(!confirm('Sair do sistema?')) return;
  logAcesso('saida','clicou em Sair');
  LOGGED_OUT=true;
  setTimeout(function(){ window.location.reload(); },250);
}
window.addEventListener('beforeunload',function(){ if(CUR_USER&&!LOGGED_OUT){ LOGGED_OUT=true; logAcesso('saida','fechou o painel'); } });

/* ---------- aplica as travas na tela (roda a cada renderização) ---------- */
function lockInputs(el){
  el.querySelectorAll('input,select,textarea').forEach(function(i){
    if(/toggleCustosSel|filter|Filtro|Busca|Search/.test((i.getAttribute('onchange')||'')+(i.getAttribute('oninput')||'')+(i.id||''))) return;
    i.disabled=true;
  });
  el.querySelectorAll('[onclick]').forEach(function(b){
    var oc=b.getAttribute('onclick')||'';
    if(/upd\(|updEv\(|addEv\(|delEv\(|salvarColabAgora|removerFoto|fotoInput/.test(oc)){ if(b.tagName==='BUTTON') b.disabled=true; else b.style.pointerEvents='none'; }
  });
}
function applyPermUI(){
  if(!CUR_USER||isMaster()) return;
  var t=TAB, view=document.getElementById('view'), modal=document.getElementById('modal');
  [view,modal].forEach(function(el){ if(!el) return;
    el.querySelectorAll('[onclick]').forEach(function(b){
      var oc=b.getAttribute('onclick')||'', m;
      if(/addRow\(|newColab\(|newFreel\(/.test(oc) && !can(t,'criar')) b.style.display='none';
      if((m=oc.match(/delRow\('(\w+)','([^']+)'/)) && !canDelRec(m[1],m[2])) b.style.display='none';
      if(/exportJSON\(|pushAll\(|restaurarPlanilha\(/.test(oc)) b.style.display='none';
    });
  });
  if(!TBL[t]) return;
  var ovOpen=document.getElementById('overlay').className.indexOf('show')>=0;
  if(modal&&ovOpen){
    var mid=t==='colaboradores'?window._curColab:(t==='freelancers'?window._curFreel:null);
    if(mid?!canEditRec(t,mid):!can(t,'editar')) lockInputs(modal);
  }
  if(view) view.querySelectorAll('tr[data-id]').forEach(function(tr){ if(!canEditRec(t,tr.getAttribute('data-id'))) lockInputs(tr); });
}
(function(){
  var busy=false;
  function run(){ if(busy) return; busy=true; try{ applyPermUI(); }finally{ busy=false; } }
  var mo=new MutationObserver(run);
  ['view','modal'].forEach(function(id){ var el=document.getElementById(id); if(el) mo.observe(el,{childList:true,subtree:true}); });
})();

/* ---------- ABA 🔐 USUÁRIOS (só a master) ---------- */
function permResumo(u){
  if(u.master) return 'Acesso total a todas as abas';
  var p=u.permissoes||{}, abas=0, acoes=0;
  PERM_TABS.forEach(function(t){ var x=p[t.id]||{}; if(x.ver)abas++; ['criar','editar','excluir'].forEach(function(a){ if(x[a])acoes++; }); });
  return abas+' aba'+(abas!==1?'s':'')+' liberada'+(abas!==1?'s':'')+(acoes?' · '+acoes+' ação'+(acoes!==1?'ões':'')+' de edição':' · só visualização');
}
function userStatusChip(u){
  if(u.master) return '<span class="chip c-info">👑 Master</span>';
  if(u.ativo===false) return '<span class="chip c-mut">⏸ Desativado</span>';
  if(u.bloqueado) return '<span class="chip c-crit">🔒 Bloqueado</span>';
  if(!u.pin_hash) return '<span class="chip c-warn">🔑 Aguardando 1º acesso</span>';
  return '<span class="chip c-ok">✅ Ativo</span>';
}
function viewUsuarios(){

  var ativos=USERS.filter(function(u){return u.ativo!==false;}).length;
  var bloq=USERS.filter(function(u){return u.bloqueado&&!u.master;}).length;
  var entradasHoje=ACESSOS.filter(function(a){return a.evento==='entrada'&&(''+a.quando).slice(0,10)===hoje;}).length;
  var errosHoje=ACESSOS.filter(function(a){return a.evento==='pin_errado'&&(''+a.quando).slice(0,10)===hoje;}).length;
  var h='<div class="kpis">';
  h+=kpi('Usuários ativos',ativos,USERS.length+' cadastrados',true);

  h+=kpi('Entradas hoje',entradasHoje,'acessos ao painel');
  h+=kpi('PINs errados hoje',errosHoje,'tentativas incorretas');

  h+='<div class="subtabs">';
  h+='<button class="'+(USR_SUB==='usuarios'?'active':'')+'" onclick="USR_SUB=\'usuarios\';render()">👥 Usuários ('+USERS.length+')</button>';
  h+='<button class="'+(USR_SUB==='acessos'?'active':'')+'" onclick="USR_SUB=\'acessos\';render()">📜 Registro de acessos</button>';
  h+='</div>';
  if(USR_SUB==='usuarios'){
    h+='<div class="toolbar"><button class="btn" onclick="openUser(null)">+ Novo usuário</button>'+
       '<button class="btn ghost sm" onclick="usrRefresh()">↻ Atualizar</button>'+
       '<span class="muted" style="font-size:12px">Clique no card para editar permissões, redefinir PIN, bloquear ou desbloquear.</span></div>';
    h+='<div class="empgrid">';
    USERS.slice().sort(function(a,b){ if(a.master!==b.master) return a.master?-1:1; return (a.nome||'').localeCompare(b.nome||''); }).forEach(function(u){
      h+='<div class="card searchcard user-card'+(u.bloqueado&&!u.master?' user-bloq':'')+'" onclick="openUser(\''+u.id+'\')">';
      h+='<div class="flex" style="justify-content:space-between;align-items:center;gap:8px"><span class="user-av">'+esc((u.nome||'?').charAt(0).toUpperCase())+'</span><span class="nm" style="flex:1">'+esc(u.nome)+'</span>'+userStatusChip(u)+'</div>';
      h+='<div class="fn" style="margin-top:6px">'+esc(permResumo(u))+'</div>';

      h+='</div>';

  h+='</div>';
  if(u.master){
    h+='<div class="card" style="border-top:2px solid var(--blue)"><div class="section-title">👑 Administradora master</div><div class="muted" style="font-size:12.5px;line-height:1.6">Acesso total a todas as abas, a todos os dados sensíveis e à gestão de usuários. As permissões da master não podem ser reduzidas, e ela não é bloqueada: após 5 PINs errados, o sistema só pede para aguardar 5 minutos.</div></div>';
  } else {
    h+='<div class="card" style="margin-bottom:14px"><div class="section-title">⚙️ Situação</div><div class="flex" style="gap:18px;flex-wrap:wrap">';
    h+='<label class="tgl"><input type="checkbox" id="uAtivo"'+(u.ativo!==false?' checked':'')+'> <span><b>Usuário ativo</b><br><small class="muted">Desmarque para impedir a entrada sem excluir</small></span></label>';
    h+='<label class="tgl"><input type="checkbox" id="uSens"'+(u.sensiveis?' checked':'')+'> <span><b>🔓 Ver dados sensíveis</b><br><small class="muted">Salário, cachê, dados bancários, CPF/RG</small></span></label>';
    h+='</div></div>';
    h+='<div class="card"><div class="xrow" style="margin-bottom:8px"><div class="section-title">🗂 Permissões por aba</div><div class="flex">'+
       '<button class="btn ghost sm" onclick="permPreset(\'tudo\')">✅ Liberar tudo</button>'+
       '<button class="btn ghost sm" onclick="permPreset(\'ver\')">👁 Só visualizar</button>'+
       '<button class="btn ghost sm" onclick="permPreset(\'nada\')">✖ Limpar</button></div></div>';
    h+='<div class="tablewrap"><table class="perm-tbl"><thead><tr><th>Aba</th>';
    PERM_ACTS.forEach(function(a){ h+='<th>'+a[1]+'</th>'; });
    h+='<th></th></tr></thead><tbody>';
    PERM_TABS.forEach(function(t){
      var p=u.permissoes[t.id]||{};
      h+='<tr><td><b>'+t.label+'</b></td>';
      PERM_ACTS.forEach(function(a){
        if(t.acts.indexOf(a[0])<0){ h+='<td class="muted" title="Esta aba é só de consulta">—</td>'; return; }
        h+='<td><input type="checkbox" class="pchk" id="p_'+t.id+'_'+a[0]+'"'+(p[a[0]]?' checked':'')+' onchange="permToggle(\''+t.id+'\',\''+a[0]+'\',this.checked)"></td>';
      });
      h+='<td><button class="btn ghost sm" onclick="permRow(\''+t.id+'\')">tudo</button></td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="muted" style="font-size:11.5px;margin-top:8px;line-height:1.6">Marcar Criar, Editar ou Excluir liga o <b>Ver</b> automaticamente. Quem tem só <b>Criar</b> consegue preencher o registro que acabou de criar, mas não altera registros antigos. A aba 🔐 Usuários é exclusiva da master.</div>';
    h+='</div>';
  }
  h+='<div id="uMsg" class="lock-msg" style="margin-top:12px"></div>';
  h+='<div class="flex" style="margin-top:14px">';
  if(!u._novo&&!u.master) h+='<button class="btn ghost" onclick="excluirUser(\''+u.id+'\')">🗑 Excluir usuário</button>';
  h+='<button class="btn save" style="margin-left:8px" onclick="saveUser()">💾 Salvar usuário</button><span class="right muted">As alterações valem a partir da próxima entrada da pessoa.</span></div>';
  return h;
}
function permToggle(tab,act,on){
  var p=USR_DRAFT.permissoes[tab]=USR_DRAFT.permissoes[tab]||{};
  p[act]=on;
  if(on&&act!=='ver'){ p.ver=true; var v=document.getElementById('p_'+tab+'_ver'); if(v)v.checked=true; }
  if(!on&&act==='ver'){ ['criar','editar','excluir'].forEach(function(a){ p[a]=false; var c=document.getElementById('p_'+tab+'_'+a); if(c)c.checked=false; }); }
}
function permRow(tab){
  var t=null; PERM_TABS.forEach(function(x){ if(x.id===tab)t=x; });
  var p=USR_DRAFT.permissoes[tab]=USR_DRAFT.permissoes[tab]||{};
  var all=t.acts.every(function(a){ return p[a]; });
  t.acts.forEach(function(a){ p[a]=!all; var c=document.getElementById('p_'+tab+'_'+a); if(c)c.checked=!all; });
}
function permPreset(mode){
  PERM_TABS.forEach(function(t){
    var p=USR_DRAFT.permissoes[t.id]={};
    t.acts.forEach(function(a){ p[a]=(mode==='tudo')||(mode==='ver'&&a==='ver'); var c=document.getElementById('p_'+t.id+'_'+a); if(c)c.checked=p[a]; });
  });
}
function uMsg(t,cls){ var el=document.getElementById('uMsg'); if(el){ el.className='lock-msg '+(cls||'err'); el.innerHTML=t; } }
function saveUser(){
  var u=USR_DRAFT; if(!u) return;
  var nome=(document.getElementById('uNome').value||'').trim();
  var p1=document.getElementById('uPin').value, p2=document.getElementById('uPin2').value;
  if(!nome) return uMsg('Informe o nome.');
  var dup=USERS.some(function(x){ return x.id!==u.id&&(x.nome||'').trim().toLowerCase()===nome.toLowerCase(); });
  if(dup) return uMsg('Já existe um usuário com esse nome — use um nome diferente (ex.: com sobrenome).');
  if(p1||p2){
    if(!pinValido(p1)) return uMsg('O PIN precisa ter exatamente 6 números.');
    if(p1!==p2) return uMsg('Os PINs não conferem.');
  }
  var eraNovo=!!u._novo, nomeAntigo=u.nome;
  u.nome=nome;
  if(!u.master){
    u.ativo=document.getElementById('uAtivo').checked;
    u.sensiveis=document.getElementById('uSens').checked;
  }
  var pinTrocado=false;
  if(p1){ u.salt=uid(); u.pin_hash=pinHash(u.salt,p1); u.tentativas=0; u.bloqueado=false; pinTrocado=true; }
  u.atualizado_em=new Date().toISOString();
  if(eraNovo) u.criado_em=u.atualizado_em;
  var row={}; ['id','nome','pin_hash','salt','master','ativo','bloqueado','tentativas','sensiveis','permissoes','criado_em','atualizado_em'].forEach(function(k){ if(u[k]!==undefined) row[k]=u[k]; });
  uMsg('Salvando...','info');
  sbUpsert(TBL_USERS,row,function(ok,err){
    if(!ok) return uMsg('Falha ao salvar: '+esc((''+err).slice(0,200)));
    delete u._novo;
    var i=-1; USERS.forEach(function(x,k){ if(x.id===u.id)i=k; });
    if(i>=0) USERS[i]=u; else USERS.push(u);
    if(CUR_USER&&CUR_USER.id===u.id){ CUR_USER.nome=u.nome; renderUserChip(); }
    logAcesso(eraNovo?'usuario_criado':'usuario_alterado',nome+(eraNovo?'':(nomeAntigo!==nome?' (antes: '+nomeAntigo+')':''))+' — '+permResumo(u));
    if(pinTrocado&&!eraNovo) logAcesso('pin_redefinido',nome);
    USR_DRAFT=null; closeOv();
    showWarn('✅ Usuário "'+nome+'" salvo.');
  });
}
function desbloquearUser(id){
  sbPatch(TBL_USERS,id,{bloqueado:false,tentativas:0,atualizado_em:new Date().toISOString()},function(ok){
    if(!ok) return uMsg('Falha ao desbloquear.');
    var nome=''; USERS.forEach(function(x){ if(x.id===id){ x.bloqueado=false; x.tentativas=0; nome=x.nome; } });
    if(USR_DRAFT&&USR_DRAFT.id===id){ USR_DRAFT.bloqueado=false; USR_DRAFT.tentativas=0; }
    logAcesso('desbloqueio',nome);
    document.getElementById('modal').innerHTML=userModal(USR_DRAFT);
    showWarn('🔓 '+nome+' desbloqueado.');
  });
}
function excluirUser(id){
  var u=null; USERS.forEach(function(x){ if(x.id===id)u=x; });
  if(!u||u.master) return;
  if(!confirm('Excluir o usuário "'+u.nome+'"?\n\nDica: se for só temporário, prefira desmarcar "Usuário ativo".')) return;
  sbDelete(TBL_USERS,id,function(ok){
    if(!ok) return uMsg('Falha ao excluir.');
    USERS=USERS.filter(function(x){ return x.id!==id; });
    logAcesso('usuario_excluido',u.nome);
    USR_DRAFT=null; closeOv();
  });
}


/* ================= ▾ SEÇÕES RECOLHÍVEIS (todas as abas e janelas) =================
   Todo card com título de seção (.section-title) ganha uma seta ▾/▸.
   Clique no título para recolher/expandir. A escolha fica salva neste computador. */
var COLLAPSE=(function(){ try{ return JSON.parse(window.localStorage.getItem('dp_iled_collapse')||'{}'); }catch(e){ return {}; } })();
function saveCollapse(){ try{ window.localStorage.setItem('dp_iled_collapse',JSON.stringify(COLLAPSE)); }catch(e){} }
function colKey(title,inModal){
  var t=(title.textContent||'').replace(/[▾▸]/g,'').replace(/\(\d+\)|\d+/g,'').replace(/\s+/g,' ').trim().toLowerCase();
  return (inModal?'m:':'v:')+TAB+':'+t;
}
function colSetCard(card,fechado){
  card.classList.toggle('collapsed',!!fechado);
  var a=card.querySelector('.col-head .col-arrow');
  if(a) a.textContent=fechado?'▸':'▾';
}
function colToggle(card){
  var fechado=!card.classList.contains('collapsed');
  colSetCard(card,fechado);
  var k=card.getAttribute('data-colkey2'); if(k){ if(fechado) COLLAPSE[k]=1; else delete COLLAPSE[k]; saveCollapse(); }
}
function colAll(root,fechar){
  root.querySelectorAll('.card.col-ready').forEach(function(card){
    colSetCard(card,fechar);
    var k=card.getAttribute('data-colkey2'); if(k){ if(fechar) COLLAPSE[k]=1; else delete COLLAPSE[k]; }
  });
  saveCollapse();
}
function applyCollapsers(root,inModal){
  if(!root) return;
  var n=0;
  root.querySelectorAll('.section-title').forEach(function(t){
    var card=t.closest('.card'); if(!card||!root.contains(card)) return;
    if(card.classList.contains('col-ready')){ n++; return; }
    if(card.classList.contains('searchcard')||card.classList.contains('kpi')) return;
    // sobe até o filho direto do card que contém o título (cabeçalho)
    var head=t; while(head.parentElement&&head.parentElement!==card) head=head.parentElement;
    if(head.parentElement!==card) return;
    // só vale se houver conteúdo além do cabeçalho
    if(!head.nextElementSibling) return;
    card.classList.add('col-ready'); head.classList.add('col-head');
    var ar=document.createElement('span'); ar.className='col-arrow'; ar.textContent='▾';
    t.insertBefore(ar,t.firstChild);
    t.classList.add('col-title'); t.title='Clique para recolher / expandir';
    var k=colKey(t,inModal); card.setAttribute('data-colkey2',k);
    t.addEventListener('click',function(e){ e.stopPropagation(); colToggle(card); });
    if(COLLAPSE[k]) colSetCard(card,true);
    n++;
  });
  // barra "Recolher tudo / Expandir tudo" nas janelas (fichas) com 2+ seções
  if(inModal&&n>=2&&!root.querySelector('.col-bar')){
    var xr=root.querySelector('.xrow');
    if(xr){
      var bar=document.createElement('div'); bar.className='col-bar';
      bar.innerHTML='<button class="btn ghost sm" type="button">▸ Recolher tudo</button><button class="btn ghost sm" type="button">▾ Expandir tudo</button>';
      bar.children[0].onclick=function(){ colAll(root,true); };
      bar.children[1].onclick=function(){ colAll(root,false); };
      xr.parentNode.insertBefore(bar,xr.nextSibling);
    }
  }
}
(function(){
  var busy=false;
  function run(){ if(busy) return; busy=true; try{ applyCollapsers(document.getElementById('view'),false); applyCollapsers(document.getElementById('modal'),true); }finally{ busy=false; } }
  var mo=new MutationObserver(run);
  ['view','modal'].forEach(function(id){ var el=document.getElementById(id); if(el) mo.observe(el,{childList:true,subtree:true}); });
})();
