<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DP ILED — Departamento Pessoal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0b0f;--bg2:#111319;--panel:#14161d;--panel2:#171922;--panelh:#1b1e28;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --txt:#eef0f5;--mut:#9aa0af;--mut2:#6b7180;
  --red:#e10600;--red2:#ff1f44;--grn:#3ddc84;--amber:#ffb020;--blue:#4f8cff;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --glass:rgba(24,26,34,.55);--glass-hi:rgba(255,255,255,.06);
  --glass-bd:rgba(255,255,255,.12);
  --glass-sh:0 10px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.10);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--txt);font-size:14px;
  background:
    radial-gradient(1200px 600px at 85% -10%,rgba(225,6,0,.16),transparent 60%),
    radial-gradient(900px 520px at 0% 0%,rgba(255,31,68,.10),transparent 55%),
    #0a0b0f;
  min-height:100vh;
}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.subbar{height:4px;width:100%;display:flex;position:sticky;top:0;z-index:50}
.subbar span{flex:1}
.subbar span:nth-child(1){background:var(--red)}
.subbar span:nth-child(2){background:var(--amber)}
.subbar span:nth-child(3){background:#e9ecf5}
.subbar span:nth-child(4){background:var(--blue)}
header,nav.tabs,main{position:relative;z-index:1}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;flex-wrap:wrap}
header img{height:52px;width:auto;border-radius:8px}
.logo-electric{
  filter:drop-shadow(0 0 6px rgba(120,180,255,.55)) drop-shadow(0 0 16px rgba(225,6,0,.35));
  animation:zap 4.5s infinite;
}
@keyframes zap{
  0%,100%{filter:drop-shadow(0 0 6px rgba(120,180,255,.5)) drop-shadow(0 0 16px rgba(225,6,0,.3))}
  47%{filter:drop-shadow(0 0 6px rgba(120,180,255,.5)) drop-shadow(0 0 16px rgba(225,6,0,.3))}
  49%{filter:drop-shadow(0 0 12px rgba(150,200,255,.95)) drop-shadow(0 0 26px rgba(255,31,68,.7)) brightness(1.25)}
  51%{filter:drop-shadow(0 0 6px rgba(120,180,255,.5)) drop-shadow(0 0 16px rgba(225,6,0,.3))}
  54%{filter:drop-shadow(0 0 14px rgba(150,200,255,1)) drop-shadow(0 0 30px rgba(255,31,68,.8)) brightness(1.35)}
  56%{filter:drop-shadow(0 0 6px rgba(120,180,255,.5)) drop-shadow(0 0 16px rgba(225,6,0,.3))}
}
.htitle{font-weight:800;letter-spacing:-.4px;font-size:18px;line-height:1}
.hsub{color:var(--mut);font-size:12px;margin-top:3px}
.dbchip{margin-left:auto;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut2);display:inline-block}
.dot.on{background:var(--grn);box-shadow:0 0 10px rgba(61,220,132,.8)}
.dot.off{background:var(--amber)}
nav.tabs{display:flex;gap:4px;padding:0 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.tabs button{
  background:none;border:none;padding:11px 16px;cursor:pointer;color:var(--mut);
  font-weight:600;font-size:13px;border-bottom:2px solid transparent;font-family:inherit;
}
nav.tabs button.active{color:var(--txt);border-bottom-color:var(--red)}
main{padding:20px 22px 60px;max-width:1500px;margin:0 auto}
.panel,.card{
  background:linear-gradient(180deg,var(--glass-hi) 0%,var(--glass) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--glass-bd);border-top:1px solid rgba(255,255,255,.18);
  border-radius:14px;box-shadow:var(--glass-sh);
}
.card{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi .eye{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.kpi .big{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:6px}
.kpi .desc{font-size:11.5px;color:var(--mut);margin-top:3px}
.kpi.hero{border-top:3px solid var(--red);background:linear-gradient(180deg,rgba(225,6,0,.14),var(--glass))}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select{
  font-family:inherit;font-size:13px;color:var(--txt);background:rgba(255,255,255,.04);
  border:1px solid var(--line2);border-radius:9px;padding:8px 10px;outline:none;
}
input::placeholder{color:var(--mut2)}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(225,6,0,.25)}
select option{background:#14161d;color:var(--txt)}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut);font-weight:600}
.btn{
  border:none;border-radius:10px;padding:9px 15px;font-weight:700;font-size:13px;
  cursor:pointer;font-family:inherit;background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(225,6,0,.4);
}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.save{background:var(--mut2)}
.btn.save.draft{background:var(--amber)}
.btn.save.saved{background:var(--grn)}
.tablewrap{overflow:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{
  background:var(--panelh);color:var(--mut);text-transform:uppercase;font-size:10px;
  letter-spacing:.8px;padding:9px 10px;text-align:left;position:sticky;top:0;white-space:nowrap;
}
td{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--txt)}
tr:nth-child(even) td{background:rgba(255,255,255,.025)}
tr:hover td{background:rgba(255,255,255,.05)}
td input,td select{border:1px solid transparent;background:transparent;padding:5px 6px;width:100%;min-width:70px;border-radius:6px;color:var(--txt)}
td input:hover,td select:hover{border-color:var(--line2)}
td input:focus,td select:focus{border-color:var(--red);background:rgba(255,255,255,.06)}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.c-ok{background:rgba(61,220,132,.16);color:#4fe89a}
.c-warn{background:rgba(255,176,32,.16);color:#ffc457}
.c-crit{background:rgba(255,31,68,.18);color:#ff6b82}
.c-info{background:rgba(79,140,255,.16);color:#7aa8ff}
.c-mut{background:rgba(255,255,255,.08);color:var(--mut)}
.section-title{font-weight:800;font-size:15px;margin:0 0 4px}
.section-sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.subtabs{display:flex;gap:6px;margin:6px 0 16px;flex-wrap:wrap}
.subtabs button{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--mut);font-family:inherit}
.subtabs button.active{background:rgba(225,6,0,.14);color:var(--txt);border-color:var(--red);box-shadow:var(--glass-sh)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 14px;overflow:auto}
.overlay.show{display:flex}
.modal{width:100%;max-width:920px;padding:22px;margin:auto 0}
.modal h2{margin:0 0 2px;font-size:18px}
.xrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.close{cursor:pointer;font-size:22px;color:var(--mut);background:none;border:none}
.searchcard{cursor:pointer;transition:transform .1s}
.searchcard:hover{transform:translateY(-2px);border-color:rgba(225,6,0,.45)}
.emp-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--mut)}
.venc-line{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.muted{color:var(--mut)}
canvas{max-width:100%}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.empgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.empcard .nm{font-weight:700;font-size:13.5px;margin-bottom:2px}
.empcard .fn{color:var(--mut);font-size:11.5px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>

var TBL = {colaboradores:'dp_colaboradores',rescisoes:'dp_rescisoes',ferias:'dp_ferias',folha:'dp_folha',custos:'dp_custos'};
function sbHeaders(){ return {'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'}; }
function sbConfigured(){ return CFG.url && CFG.key; }
function setDbStatus(on,txt){
  var d=document.getElementById('dbdot'), t=document.getElementById('dbtxt');
  d.className='dot '+(on?'on':'off'); t.textContent=txt;
}
function sbTest(cb){
  if(!sbConfigured()){ setDbStatus(false,'Modo local'); return; }
  fetch(CFG.url+'/rest/v1/'+TBL.colaboradores+'?select=id&limit=1',{headers:sbHeaders()})
    .then(function(r){ if(r.ok){ setDbStatus(true,'Supabase conectado'); if(cb)cb(true); } else { setDbStatus(false,'Erro Supabase'); if(cb)cb(false);} })
    .catch(function(){ setDbStatus(false,'Sem conexão'); if(cb)cb(false); });
}
function sbPull(){
  if(!sbConfigured()){ alert('Configure a URL e a chave do Supabase primeiro.'); return; }
  var keys=Object.keys(TBL), done=0, tmp={};
  keys.forEach(function(k){
    fetch(CFG.url+'/rest/v1/'+TBL[k]+'?select=*',{headers:sbHeaders()})
      .then(function(r){return r.json();})
      .then(function(rows){ tmp[k]=Array.isArray(rows)?rows:[]; done++; if(done===keys.length)finishPull(tmp); })
      .catch(function(){ tmp[k]=[]; done++; if(done===keys.length)finishPull(tmp); });
  });
}
function finishPull(tmp){
  var total=0; for(var k in tmp){ if(tmp[k])total+=tmp[k].length; }
  if(total===0){
    alert('O Supabase está VAZIO — nada foi carregado. Seus dados locais foram mantidos.\n\nSe você ainda não populou o banco, use "Enviar tudo p/ Supabase".');
    return;
  }
  STORE=tmp; saveLocal(); render();
  alert('Dados carregados do Supabase: '+total+' registros.');
}

function isISODate(v){ return /^\d{4}-\d{2}-\d{2}/.test(''+v); }
function cleanRow(t,src){
  var r={}, allow=ALLOWED[t]||null;
  for(var k in src){ if(!src.hasOwnProperty(k))continue; if(allow&&allow.indexOf(k)<0)continue; r[k]=src[k]; }
  var dc=DATECOLS[t]||[], nc=NUMCOLS[t]||[];
  for(var i=0;i<dc.length;i++){ var d=r[dc[i]]; if(d===''||d===undefined||!isISODate(d)) r[dc[i]]=null; else r[dc[i]]=(''+d).slice(0,10); }
  for(var j=0;j<nc.length;j++){ var n=r[nc[j]]; if(n===''||n===undefined||n===null||isNaN(parseFloat(n))) r[nc[j]]=null; else r[nc[j]]=parseFloat(n); }
  for(var kk in r){ if(r[kk]==='') r[kk]=null; }
  return r;
}
function sbUpsert(table,row,cb){
  fetch(CFG.url+'/rest/v1/'+table+'?on_conflict=id',{
    method:'POST',
    headers:Object.assign({},sbHeaders(),{'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify(row)
  }).then(function(r){ if(r.ok){ if(cb)cb(true); } else { r.text().then(function(tx){ if(cb)cb(false,r.status+': '+tx); }); } })
    .catch(function(e){ if(cb)cb(false,'rede: '+e); });
}
function sbDelete(table,id,cb){
  fetch(CFG.url+'/rest/v1/'+table+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:sbHeaders()})
    .then(function(r){ if(cb)cb(r.ok);}).catch(function(){ if(cb)cb(false);});
}

/* ================= HELPERS ================= */
function money(v){ if(v===null||v===undefined||v==='')return ''; var n=parseFloat(v); if(isNaN(n))return ''; return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function fmtD(s){ if(!s)return ''; var p=(''+s).slice(0,10).split('-'); if(p.length!==3)return s; return p[2]+'/'+p[1]+'/'+p[0]; }
function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ if(!a||!b)return null; var d1=new Date(a),d2=new Date(b); return Math.round((d2-d1)/86400000); }
function addMonths(iso,m){ if(!iso)return ''; var d=new Date(iso); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); }
function addDays(iso,n){ if(!iso)return ''; var d=new Date((''+iso).slice(0,10)); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

/* vencimento status: retorna {cls,label,dias} baseado numa data alvo */
function vencStatus(dateIso){
  if(!dateIso) return {cls:'c-mut',label:'—'};
  var dd = daysBetween(today(), (''+dateIso).slice(0,10));
  if(dd===null) return {cls:'c-mut',label:'—'};
  if(dd<0) return {cls:'c-crit',label:'Vencido '+(-dd)+'d'};
  if(dd<=30) return {cls:'c-warn',label:'Vence em '+dd+'d'};
  return {cls:'c-ok',label:'OK ('+dd+'d)'};
}

function esc(s){ if(s===null||s===undefined)return''; return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* --- Status de férias (cruza colaboradores x registros) --- */
function normname(s){ return (''+(s||'')).toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-zà-ú ]/gi,'').replace(/\s+/g,' ').trim(); }
function feriasStatus(){
  var regs=STORE.ferias, ativas=[], aguardando=[], vencidas=[];
  var tdy=today();
  // ativas: registro em gozo hoje
  regs.forEach(function(r){ var i=(''+(r.inicio||'')).slice(0,10), f=(''+(r.fim||'')).slice(0,10); if(i&&f&&i<=tdy&&tdy<=f) ativas.push(r); });
  // mapa nome -> registros de férias
  var byName={};
  regs.forEach(function(r){ var k=normname(r.colaborador); if(!k)return; (byName[k]=byName[k]||[]).push(r); });
  // colaboradores ativos
  STORE.colaboradores.forEach(function(c){
    if(c.ativo===false) return;
    var adm=(''+(c.admissao||'')).slice(0,10); if(!adm) return;
    var meses=Math.floor((daysBetween(adm,tdy)||0)/30.44);
    var recs=byName[normname(c.nome)]||[];
    var emGozoAgora=recs.some(function(r){ var i=(''+(r.inicio||'')).slice(0,10),f=(''+(r.fim||'')).slice(0,10); return i&&f&&i<=tdy&&tdy<=f; });
    var temFuturo=recs.some(function(r){ var i=(''+(r.inicio||'')).slice(0,10); return i&&i>=tdy; });
    // aguardando marcação: já adquiriu (>=12m), não está em gozo e não tem férias futuras marcadas
    if(meses>=12 && !emGozoAgora && !temFuturo){ aguardando.push({nome:c.nome,meses:meses,empresa:c.empresa}); }
    // vencidas: estourou prazo concessivo (>=24m) e nunca gozou / sem registro dentro do prazo
    if(meses>=24){
      var gozou=recs.some(function(r){ return (''+(r.fim||'')).slice(0,10) && (''+(r.fim||'')).slice(0,10) < tdy; });
      if(!gozou) vencidas.push({nome:c.nome,meses:meses,empresa:c.empresa});
    }
  });
  return {ativas:ativas,aguardando:aguardando,vencidas:vencidas,reg:regs.length};
}

  var fs=feriasStatus();
  function block(title,cls,arr,mapper){
    var h='<div class="card" style="flex:1;min-width:230px"><div class="section-title">'+title+' <span class="chip '+cls+'">'+arr.length+'</span></div><div style="margin-top:8px;max-height:190px;overflow:auto">';
    if(!arr.length) h+='<div class="muted" style="font-size:12px">Nenhum.</div>';
    arr.forEach(function(x){ h+='<div class="venc-line">'+mapper(x)+'</div>'; });
    return h+'</div></div>';
  }
  var h='<div class="flex" style="gap:16px;margin-bottom:16px;align-items:stretch">';
  h+=block('🟢 Em gozo (ativas)','c-ok',fs.ativas,function(r){ return '<span>'+esc(r.colaborador||'—')+'</span><span class="muted" style="font-size:11px">até '+fmtD(r.fim)+'</span>'; });
  h+=block('🟠 Aguardando marcação','c-warn',fs.aguardando.sort(function(a,b){return b.meses-a.meses;}),function(x){ return '<span>'+esc(x.nome)+'</span><span class="muted" style="font-size:11px">'+x.meses+' meses</span>'; });
  h+=block('🔴 Férias vencidas','c-crit',fs.vencidas.sort(function(a,b){return b.meses-a.meses;}),function(x){ return '<span>'+esc(x.nome)+'</span><span class="chip c-crit">'+x.meses+'m</span>'; });
  h+='</div>';
  return h;
}

function viewGeneric(t){
  var cols=COLS[t], rows=STORE[t];
  var h='';
  // KPIs
  h+='<div class="kpis">';
  if(t==='rescisoes'){ h+=kpi('Rescisões',rows.length,'registros',true); h+=kpi('Valor total',money(sum(rows,'valor')),'somatório'); h+=kpi('Pendentes financeiro',rows.filter(function(r){return !isYes(r.financeiro);}).length,'não entregues'); }
  else if(t==='ferias'){ var fs=feriasStatus(); h+=kpi('Em gozo (ativas)',fs.ativas.length,'de férias hoje',true); h+=kpi('Aguardando marcação',fs.aguardando.length,'≥12 meses sem marcar'); h+=kpi('Vencidas',fs.vencidas.length,'prazo concessivo estourado'); h+=kpi('Valor total',money(sum(rows,'valor')),fs.reg+' lançamentos'); }
  else if(t==='folha'){ h+=kpi('Competências',rows.length,'meses lançados',true); h+=kpi('Total folha',money(sum(rows,'total')),'somatório'); h+=kpi('Gratificações',money(sum(rows,'gratif')),'somatório'); }
  else { h+=kpi('Lançamentos',rows.length,'registros',true); h+=kpi('Valor total',money(sum(rows,'valor')),'somatório'); }
  h+='</div>';

  if(t==='ferias') h+=feriasPanel();

  h+='<div class="card">';
  h+='<div class="xrow"><div><div class="section-title">'+TITLES[t][0]+'</div><div class="muted" style="font-size:12px">'+TITLES[t][1]+'</div></div>';
  h+='<div class="flex"><input placeholder="🔎 Buscar" oninput="filterTable(this,\''+t+'\')"><button class="btn" onclick="addRow(\''+t+'\')">+ Adicionar</button></div></div>';
  h+='<div class="tablewrap"><table id="tbl_'+t+'"><thead><tr>';
  cols.forEach(function(c){ h+='<th>'+c[1]+'</th>'; });
  h+='<th></th></tr></thead><tbody>';
  h+=tableRows(t);
  h+='</tbody></table></div></div>';
  return h;
}
function tableRows(t){
  var cols=COLS[t]; var h='';
  STORE[t].forEach(function(r){
    h+='<tr data-id="'+r.id+'">';
    cols.forEach(function(c){ h+='<td>'+cellEditor(t,r,c)+'</td>'; });
    h+='<td><button class="btn ghost sm" onclick="delRow(\''+t+'\',\''+r.id+'\')">🗑</button></td>';
    h+='</tr>';
  });
  return h;
}
function cellEditor(t,r,c){
  var key=c[0], type=c[2], val=r[key]===null||r[key]===undefined?'':r[key];
  var on='onchange="upd(\''+t+'\',\''+r.id+'\',\''+key+'\',this.value)"';
  if(type==='sel'){
    var emps=['ILED','ILED SP','NEW ILED','ILED SÃO PAULO','RED'];var opts='<option value="">—</option>';var f=false;
    emps.forEach(function(e){var s=(e===val)?' selected':'';if(s)f=true;opts+='<option'+s+'>'+e+'</option>';});
    if(val&&!f)opts+='<option selected>'+esc(val)+'</option>';
    return '<select '+on+'>'+opts+'</select>';
  }
  if(type==='doc'){
    var docs=['TRCT','FGTS MENSAL','FGTS RESCISÓRIO'];var opts='<option value="">—</option>';var f=false;
    docs.forEach(function(e){var s=(e===val)?' selected':'';if(s)f=true;opts+='<option'+s+'>'+e+'</option>';});
    if(val&&!f)opts+='<option selected>'+esc(val)+'</option>';
    return '<select '+on+'>'+opts+'</select>';
  }
  if(type==='check'){
    var yes=isYes(val);
    return '<select onchange="upd(\''+t+'\',\''+r.id+'\',\''+key+'\',this.value)"><option value="NÃO"'+(!yes?' selected':'')+'>NÃO</option><option value="SIM"'+(yes?' selected':'')+'>SIM</option></select>';
  }
  if(type==='date') return '<input type="date" value="'+esc((''+val).slice(0,10))+'" '+on+'>';
  if(type==='month'){ var mv=(''+val).slice(0,7); return '<input type="month" value="'+esc(mv)+'" onchange="upd(\''+t+'\',\''+r.id+'\',\''+key+'\',this.value?this.value+\'-01\':\'\')">'; }
  if(type==='num'||type==='int') return '<input type="number" step="'+(type==='int'?'1':'0.01')+'" value="'+esc(val)+'" '+on+'>';
  if(type==='autodays'){
    var d=daysBetween(r.inicio,r.fim); var calc=(d!==null&&d>=0)?(d+1):'';
    return '<input type="number" value="'+esc(val!==''?val:calc)+'" title="auto: '+(calc||'-')+'" '+on+'> <span class="muted" style="font-size:10px">auto:'+(calc||'-')+'</span>';
  }
  return '<input value="'+esc(val)+'" '+on+'>';
}
function filterTable(inp,t){
  var q=inp.value.toLowerCase();
  var tb=document.querySelectorAll('#tbl_'+t+' tbody tr');
  for(var i=0;i<tb.length;i++){ tb[i].style.display = tb[i].textContent.toLowerCase().indexOf(q)>=0?'':'none'; }
}
function addRow(t){ var r={id:uid()}; COLS[t].forEach(function(c){r[c[0]]='';}); STORE[t].push(r); persist(t,r); render(); }

/* ================= CRUD CORE ================= */
function find(t,id){ var a=STORE[t]; for(var i=0;i<a.length;i++){ if(a[i].id===id)return a[i]; } return null; }
function upd(t,id,key,val){
  var r=find(t,id); if(!r)return;
  // auto férias dias
  r[key]=val;
  if(t==='ferias'&&(key==='inicio'||key==='fim')){ var d=daysBetween(r.inicio,r.fim); if(d!==null&&d>=0)r.dias=d+1; }
  if(t==='folha'||t==='custos'){ if(key==='liquido'||key==='gratif'){ r.total=num(r.liquido)+num(r.gratif); } }
  saveLocal(); persist(t,r);
  // refresh modal/venc chips live for colaboradores
  if(t==='colaboradores'&&COLAB_SUB==='vencimentos'&&document.getElementById('overlay').className.indexOf('show')>=0){ document.getElementById('modal').innerHTML=colabModal(r); }
  if((t==='folha'||t==='custos'||t==='ferias')){ var tb=document.getElementById('tbl_'+t); if(tb){ /* light refresh totals via re-render on next paint */ } }
}
function persist(t,r){
  saveLocal();
  if(sbConfigured()){ var rc=cleanRow(t,r); rc.atualizado_em=new Date().toISOString(); sbUpsert(TBL[t],rc,function(ok,err){ setDbStatus(ok,ok?'Supabase ✓ salvo':'Falha ao salvar'); if(!ok&&err)console.warn('Supabase',err); }); }
}
function delRow(t,id){
  if(!confirm('Excluir este registro?'))return;
  STORE[t]=STORE[t].filter(function(x){return x.id!==id;});
  saveLocal();
  if(sbConfigured())sbDelete(TBL[t],id,function(){});
  closeOv(); render();
}

/* ================= KPI / DASHBOARD ================= */
function kpi(eye,big,desc,hero){ return '<div class="card kpi'+(hero?' hero':'')+'"><div class="eye">'+eye+'</div><div class="big">'+big+'</div><div class="desc">'+esc(desc||'')+'</div></div>'; }
function sum(rows,key){ var s=0; rows.forEach(function(r){s+=num(r[key]);}); return s; }
function isYes(v){ v=(''+(v||'')).toLowerCase(); return v==='sim'||v==='ok'||v==='true'||v==='1'||v==='x'; }
function mesNome(m){ return ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m]; }

var DASH_FROM='', DASH_TO='';
function viewDashboard(){
  if(!DASH_FROM){ var d=new Date(); DASH_TO=d.toISOString().slice(0,10); d.setFullYear(d.getFullYear()-1); DASH_FROM=d.toISOString().slice(0,10); }

  h+='<label class="fl">Até<input type="date" id="dto" value="'+DASH_TO+'" onchange="DASH_TO=this.value;render()"></label>';
  h+='<button class="btn ghost sm" onclick="pullBtn()">↻ Atualizar dados</button>';
  h+='</div>';

  var folha=inRange(STORE.folha,'competencia'), custos=inRange(STORE.custos,'competencia');
  var fer=inRange(STORE.ferias,'inicio'), resc=inRange(STORE.rescisoes,'desligamento');

  h+='<div class="kpis">';
  h+=kpi('Custo total folha',money(sum(folha,'total')),'no período',true);
  h+=kpi('Custos adicionais',money(sum(custos,'valor')),'no período');
  h+=kpi('Férias (valor)',money(sum(fer,'valor')),fer.length+' lançamentos');
  h+=kpi('Rescisões (valor)',money(sum(resc,'valor')),resc.length+' no período');
  h+=kpi('Colaboradores ativos',STORE.colaboradores.length,'total cadastrado');
  h+='</div>';

  h+='<div class="grid2">';
  h+='<div class="card"><div class="section-title">Evolução da folha (líquido + gratificação)</div><canvas id="chFolha" height="150"></canvas></div>';
  h+='<div class="card"><div class="section-title">Custos adicionais por mês</div><canvas id="chCustos" height="150"></canvas></div>';
  h+='</div>';
  h+='<div class="grid2" style="margin-top:18px">';
  h+='<div class="card"><div class="section-title">Folha por empresa (período)</div><canvas id="chEmp" height="150"></canvas></div>';
  h+='<div class="card"><div class="section-title">Férias vs Rescisões (valor por mês)</div><canvas id="chFerResc" height="150"></canvas></div>';
  h+='</div>';
  return h;
}
function inRange(rows,key){
  return rows.filter(function(r){ var d=(''+(r[key]||'')).slice(0,10); if(!d)return false; return d>=DASH_FROM && d<=DASH_TO; });
}
function monthKey(iso){ return (''+iso).slice(0,7); }
function pullBtn(){ if(sbConfigured()){ sbPull(); } else { render(); } }

var _charts=[];
function drawCharts(){
  _charts.forEach(function(c){try{c.destroy();}catch(e){}}); _charts=[];
  var folha=inRange(STORE.folha,'competencia').slice().sort(byMonth('competencia'));
  var custos=inRange(STORE.custos,'competencia').slice().sort(byMonth('competencia'));
  var grid={color:'rgba(255,255,255,.07)'}, tick={color:'#9aa0af'};
  var baseOpts={responsive:true,plugins:{legend:{labels:{color:'#c7ccd6'}}},scales:{x:{grid:grid,ticks:tick},y:{grid:grid,ticks:tick}}};

  // folha
  mk('chFolha',{type:'line',data:{labels:folha.map(function(r){return monthKey(r.competencia);}),
    datasets:[{label:'Líquido',data:folha.map(function(r){return num(r.liquido);}),borderColor:'#e10600',backgroundColor:'rgba(225,6,0,.08)',tension:.3,fill:true},
      {label:'Gratificação',data:folha.map(function(r){return num(r.gratif);}),borderColor:'#2455c9',tension:.3}]},options:baseOpts});
  // custos
  mk('chCustos',{type:'bar',data:{labels:custos.map(function(r){return monthKey(r.competencia);}),
    datasets:[{label:'Custos',data:custos.map(function(r){return num(r.valor);}),backgroundColor:'#b9760a'}]},options:baseOpts});
  // por empresa
  var byE={}; inRange(STORE.folha,'competencia').forEach(function(r){ byE[r.empresa||'—']=(byE[r.empresa||'—']||0)+num(r.total); });
  mk('chEmp',{type:'bar',data:{labels:Object.keys(byE),datasets:[{label:'Total folha',data:Object.keys(byE).map(function(k){return byE[k];}),backgroundColor:['#e10600','#2455c9','#1a8f52','#b9760a','#9a9fac']}]},options:Object.assign({indexAxis:'y'},baseOpts)});
  // fer vs resc
  var months={};
  inRange(STORE.ferias,'inicio').forEach(function(r){var m=monthKey(r.inicio);months[m]=months[m]||{f:0,r:0};months[m].f+=num(r.valor);});
  inRange(STORE.rescisoes,'desligamento').forEach(function(r){var m=monthKey(r.desligamento);months[m]=months[m]||{f:0,r:0};months[m].r+=num(r.valor);});
  var mk2=Object.keys(months).sort();
  mk('chFerResc',{type:'line',data:{labels:mk2,datasets:[
    {label:'Férias',data:mk2.map(function(m){return months[m].f;}),borderColor:'#1a8f52',tension:.3},
    {label:'Rescisões',data:mk2.map(function(m){return months[m].r;}),borderColor:'#e10600',tension:.3}]},options:baseOpts});
}
function byMonth(k){ return function(a,b){ return (''+a[k]).slice(0,10)<(''+b[k]).slice(0,10)?-1:1; }; }
function mk(id,cfg){ var el=document.getElementById(id); if(!el||!window.Chart)return; _charts.push(new Chart(el.getContext('2d'),cfg)); }

function openCfg(){

  h+='<div class="muted" style="font-size:12.5px;margin-bottom:12px">Recomendado: <b>Supabase</b> (mesmo padrão do Sistema Unificado ILED, dados relacionais, RLS por setor). Cole a URL e a chave <b>anon</b>. Enquanto vazio, o sistema roda 100% local no navegador e você já pode implantar/editar tudo.</div>';
  h+='<label class="fl" style="margin-bottom:10px">URL do projeto<input id="cfgUrl" placeholder="https://xxxx.supabase.co" value="'+esc(CFG.url)+'"></label>';
  h+='<label class="fl" style="margin-bottom:14px">Chave anon (public)<input id="cfgKey" placeholder="eyJhbGciOi..." value="'+esc(CFG.key)+'"></label>';
  h+='<div class="flex"><button class="btn" onclick="saveCfg()">Salvar e testar</button>';
  h+='<button class="btn ghost" onclick="sbPull()">↓ Carregar dados do Supabase</button>';
  h+='<button class="btn ghost" onclick="pushAll()">↑ Enviar tudo p/ Supabase</button></div>';
  h+='<div style="margin-top:10px"><button class="btn ghost sm" onclick="restaurarPlanilha()">♻ Restaurar dados da planilha (local)</button></div>';
  h+='<div class="muted" style="font-size:11.5px;margin-top:14px">Passos: 1) crie as tabelas com o arquivo <b>dp_schema.sql</b> no SQL Editor. 2) cole URL+chave aqui. 3) "Enviar tudo" popula o banco com o que está no sistema. Depois do go-live, nunca rode scripts com TRUNCATE.</div>';
  document.getElementById('cfgbox').innerHTML=h;
  document.getElementById('cfgov').className='overlay show';
}
function saveCfg(){ var u=(document.getElementById('cfgUrl').value||'').trim(); u=u.replace(/\/+$/,''); u=u.replace(/\/rest\/v1$/,''); u=u.replace(/\/+$/,''); CFG.url=u; CFG.key=(document.getElementById('cfgKey').value||'').trim(); try{window.localStorage.setItem('dp_iled_cfg',JSON.stringify(CFG));}catch(e){} sbTest(function(){}); closeCfg(); }
function pushAll(){
  if(!sbConfigured()){ alert('Preencha URL e chave.'); return; }
  var keys=Object.keys(TBL), total=0, done=0, okc=0, errs=[];
  keys.forEach(function(k){ total+=STORE[k].length; });
  if(total===0){ alert('Nada para enviar.'); return; }
  setDbStatus(true,'Enviando...');
  keys.forEach(function(k){
    STORE[k].forEach(function(r){
      var rc=cleanRow(k,r); rc.atualizado_em=new Date().toISOString();
      sbUpsert(TBL[k],rc,function(ok,err){
        done++; if(ok)okc++; else if(err&&errs.length<3)errs.push(TBL[k]+' → '+err);
        if(done>=total){
          if(okc===total){ setDbStatus(true,'Supabase ✓ '+okc+' enviados'); alert('✅ Enviado com sucesso: '+okc+' registros.'); }
          else { setDbStatus(false,'Falhou '+(total-okc)); alert('⚠ Enviados: '+okc+' de '+total+'.\n\nExemplos de erro:\n'+errs.join('\n\n')+'\n\nSe for erro 401/permission, rode as policies (RLS). Se for de coluna/data, me manda esse texto.'); }
          render();
        }
      });
    });
  });
}
function closeCfg(){ document.getElementById('cfgov').className='overlay'; }
function closeOv(){ document.getElementById('overlay').className='overlay'; if(TAB==='colaboradores')renderColabList(); if(TAB!=='colaboradores'&&TAB!=='dashboard')render(); }
function exportJSON(){
  var blob=new Blob([JSON.stringify(STORE,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dp_iled_backup.json'; a.click();
}

/* ================= BOOT ================= */
/* ================= PARTÍCULAS (dark, vermelhas grandes, nítidas) ================= */
(function(){
  var cv=document.getElementById('bg'); if(!cv)return; var cx=cv.getContext('2d');
  var W,H,parts=[],DPR=Math.min(window.devicePixelRatio||1,2);
  function resize(){ W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; cx.setTransform(DPR,0,0,DPR,0,0); }
  window.addEventListener('resize',resize); resize();
  var N=Math.max(24,Math.min(42,Math.round(W/38)));
  function rnd(a,b){ return a+Math.random()*(b-a); }
  for(var i=0;i<N;i++){
    var big=Math.random()<.30;
    parts.push({
      x:Math.random()*W, y:Math.random()*H,
      r: big?rnd(5,9):rnd(2,4.5),           // núcleo
      halo: big?rnd(22,40):rnd(10,20),      // brilho ao redor
      vx:rnd(-.28,.28), vy:rnd(-.28,.28),
      base: big?rnd(.5,.85):rnd(.35,.6),    // brilho base
      tw: rnd(.4,1.2), ph:Math.random()*Math.PI*2, // cintilar
      hot: Math.random()<.5                 // tom mais claro (vermelho-rosa) x vermelho puro
    });
  }
  var t=0;
  function loop(){
    t+=0.016;
    cx.clearRect(0,0,W,H);
    cx.globalCompositeOperation='lighter';   // brilhos somam = mais vivo
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<-40)p.x=W+40; if(p.x>W+40)p.x=-40;
      if(p.y<-40)p.y=H+40; if(p.y>H+40)p.y=-40;
      var k=p.base*(0.7+0.3*Math.sin(t*p.tw+p.ph));   // cintilar suave
      var cr=p.hot?'255,70,90':'225,10,10';
      var mid=p.hot?'255,31,68':'225,6,0';
      // halo (gradiente radial = definição real, sem borrão chapado)
      var g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.halo);
      g.addColorStop(0,'rgba('+mid+','+(k*0.55)+')');
      g.addColorStop(0.4,'rgba('+mid+','+(k*0.18)+')');
      g.addColorStop(1,'rgba('+mid+',0)');
      cx.fillStyle=g;
      cx.beginPath(); cx.arc(p.x,p.y,p.halo,0,Math.PI*2); cx.fill();
      // núcleo nítido e brilhante
      var g2=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g2.addColorStop(0,'rgba(255,235,235,'+Math.min(1,k+0.35)+')');
      g2.addColorStop(0.5,'rgba('+cr+','+Math.min(1,k+0.15)+')');
      g2.addColorStop(1,'rgba('+mid+',0)');
      cx.fillStyle=g2;
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2); cx.fill();
    }
    cx.globalCompositeOperation='source-over';
    requestAnimationFrame(loop);
  }
  loop();
})();
